function autoStartNextZone(clearedZid) {
  const cleared = ZONES[clearedZid];
  if (!cleared) return;

  // 1. 진행 단계(Sequence) 계산
  const seq = (_autoZoneSeq[clearedZid] || 0) + 1;
  _autoZoneSeq[clearedZid] = seq;

  // 2. 이름 결정 (II, III 로마 숫자 부여)
  const romans = ["", "I", "II", "III", "IV", "V", "VI"];
  const suffix = romans[seq] || seq;
  // 기존 이름에서 이미 붙어있을지 모르는 로마 숫자 제거 후 새 숫자 부착
  const baseName = cleared.name.replace(/\s[IVX]+$/g, "");
  const newName = `${baseName} ${suffix}`;

  // 3. 스케일링 계수 설정 (III 단계가 다음 컨셉 수준이 되도록 조정)
  const diffStep = 0.3;   // 단계당 난이도 30% 증가 (III은 약 1.6배)
  const rewardStep = 0.2; // 단계당 보상 20% 증가
  const expStep = 0.35;   // 단계당 경험치 35% 증가 (성장 가속)

  const newMult = +( (cleared.diffMult || 1.0) * (1 + (seq - 1) * diffStep) ).toFixed(2);

  const newId = `auto_${clearedZid}_${seq}`;
  
  // 4. 새로운 구역 데이터 생성
  ZONES[newId] = {
    ...cleared, // 기본 지형 정보 및 티어 복사
    id: newId,
    name: newName,
    // 보상 스케일링
    rFood: Math.floor((cleared.rFood || 1) * (1 + (seq - 1) * rewardStep)),
    rGold: Math.floor((cleared.rGold || 1) * (1 + (seq - 1) * rewardStep)),
    // 자원 상한선 소폭 상승
    rStone: Math.min((cleared.rStone || 0) + Math.floor(seq / 2), 12),
    rWood: Math.min((cleared.rWood || 0) + Math.floor(seq / 2), 12),
    rIron: Math.min((cleared.rIron || 0) + Math.floor(seq / 3), 10),
    rHerb: Math.min((cleared.rHerb || 0) + Math.floor(seq / 3), 10),
    rDiamond: cleared.rDiamond,
    // 난이도 및 경험치 배율 적용
    diffMult: newMult,
    expMult: +(1 + (seq - 1) * expStep).toFixed(2),
    desc: `${baseName}의 더 깊은 곳, ${suffix} 단계 도전!`,
    finalStage: 15
  };

  currentZone = ZONES[newId];
  zoneStage = 1; 
  stage = 1;
  delete _fixedMaps[newId]; // 매 단계 새로운 무작위 지형 생성
  window._prevBattleTime = 0;
  
  buildMap(); 
  spawnEnemies();

  // 5. 이전 배치 유지 로직
  allies.forEach(a => {
    if (a.permanentlyDead) return;
    a.dead = false; 
    a.deathTime = null; 
    a.atkCd = 0;
    
    if (savedPositions[a.id]) {
      a.x = savedPositions[a.id].x;
      a.y = savedPositions[a.id].y;
      a.isDeployed = true;
    } else {
      a.isDeployed = false;
      a.x = -300;
      a.y = -300;
    }
  });

  alog(`🗺 구역 확장: ${newName} (난이도 ×${newMult})`);
  
  // 자동 진행 처리
  autoStart = true;
  const abtn = document.getElementById('btn-auto');
  if (abtn) {
    abtn.innerText = '🔄 자동 진행: ON';
    abtn.style.background = '#1a5c32';
  }
  
  enterPlacement(); 
  renderGarrisonBar(); 
  markDirty();

  // 5초 카운트다운 후 자동 시작 가이드 표시
  let sec = 5;
  const pg = document.getElementById('pg');
  if (pg) {
    pg.style.display = 'block';
    pg.style.background = '#f1c40f';
    pg.style.color = '#111';
    pg.style.pointerEvents = 'none';
    pg.innerHTML = `${newName} 준비!<br><span style="font-size:10px">${sec}초 후 자동 사냥 시작...</span>`;
    
    const tid = setInterval(() => {
      sec--;
      if (pg && pg.style.display !== 'none') {
        pg.innerHTML = `${newName} 준비!<br><span style="font-size:10px">${sec}초 후 자동 사냥 시작...</span>`;
      }
      if (sec <= 0 || isBattle) {
        clearInterval(tid);
        if (autoStart && !isBattle) toggleBattle();
      }
    }, 1000);
  }
}

// 주둔 수익 계산: 최소 1명 이상 있어야 하며, 레벨 합이 임계점에 도달하면 100% 효율
function garrisonEfficiency(rec, zid){
  const zone = ZONES[zid] || ZONES.hunt;
  const isHunt = zone.tier === 'hunt';
  const isPred = zone.tier === 'pred';
  const maxLvPerUnit = isHunt ? 10 : isPred ? 15 : 30;
  
  // [수정] 주둔 인원이 0명이면 효율은 즉시 0이 됩니다.
  if(!rec.garrison || rec.garrison.length === 0) return 0;

  const totalLv = rec.garrison.reduce((s, g) => {
    const u = allies.find(a => a.id === g.id);
    const lv = Math.min(u ? u.lv : g.lv, maxLvPerUnit);
    return s + lv;
  }, 0);

  // 효율 기준점: (최대 레벨 * 6명) * 0.8
  const threshold = (maxLvPerUnit * 6) * 0.8;
  
  // 1명이라도 있으면 기본 50%(0.5) 효율에서 시작하여, 레벨 합에 따라 100%(1.0)까지 상승
  const eff = 0.5 + 0.5 * Math.max(0, Math.min(1, totalLv / threshold));

  return Math.round(eff * 100) / 100;
}

function garrisonIncomePerMin(rec){
  if(!rec.cleared||!rec.garrison||rec.garrison.length===0)return{food:0,gold:0};
  const zone=ZONES[_garrisonZoneId]||Object.values(ZONES).find(z=>zoneRecords[z.id]===rec)||ZONES.hunt;
  const clearMins=Math.max(0.5,(rec.clearTime||30000)/60000);
  const baseFoodPM=(rec.totalReward?.food||10)/clearMins*0.5;
  const baseGoldPM=(rec.totalReward?.gold||10)/clearMins*0.5;
  const eff=garrisonEfficiency(rec,_garrisonZoneId);
  return{
    food:Math.max(0,Math.floor(baseFoodPM*eff)),
    gold:Math.max(0,Math.floor(baseGoldPM*eff)),
  };
}

// 30초마다 주둔 자원 지급
let _garrisonAccum=0; // 정지 시 절반 시간 누적
function startGarrisonTick(){
  if(garrisonInterval)clearInterval(garrisonInterval);
  garrisonInterval=setInterval(()=>{
    // 전투 중이면 정상, 정지 중이면 절반 속도 누적
    if(!isBattle){
      // 전투 밖(배치/대기): 절반 속도
      _garrisonAccum+=0.5;
    } else if(isPaused){
      // 전투 일시정지: 절반 속도
      _garrisonAccum+=0.5;
    } else {
      // 전투 진행 중: 정상 속도
      _garrisonAccum+=1.0;
    }

    // 누적치가 1.0 이상일 때만 수익 지급 (30초 기준)
    if(_garrisonAccum<1.0)return;
    _garrisonAccum-=1.0;

    let gotFood=0,gotGold=0;
    Object.entries(zoneRecords).forEach(([zid,rec])=>{
      if(!rec.cleared||!rec.garrison||rec.garrison.length===0)return;
      const saved=_garrisonZoneId; _garrisonZoneId=zid;
      const r=garrisonIncomePerMin(rec);
      _garrisonZoneId=saved;
      const f=Math.floor(r.food/2), g=Math.floor(r.gold/2);
      food+=f; gold+=g; res.food=food; res.gold=gold;
      gotFood+=f; gotGold+=g;
    });
    garrisonExpTick();
    if(gotFood>0||gotGold>0){
      alog(`🏰 주둔 수익 🍖+${gotFood} 💰+${gotGold}`);
    }
    renderGarrisonBar();
    markDirty();
  },30000);
}

function gainExp(u,amount){
  if(!amount||amount<=0)return;
  const MAX_LV=50;
  if(u.lv>=MAX_LV)return; // 최대 레벨 50
  const role=u.classKey||u.baseRole;
  const mult=(role==='Tank'||role==='Heal')?0.67:1.0;
  const actual=Math.max(1,Math.round(amount*mult));
  u.exp+=actual;
  while(u.exp>=u.maxExp){
    u.exp-=u.maxExp; u.lv++;
    u.maxExp=Math.floor(u.maxExp*1.55);

    // ── 레벨업 스탯 성장 ──
    const trait=TRAITS[u.traitKey||'balanced'];
    const cls=u.classKey||'Refugee';

    // 클래스별 성장 가중치
    const clsGrow={
      Tank:    {hp:3.5,atk:0.5,def:2.5,spd:0,  magic:0},
      Melee:   {hp:1.5,atk:2.5,def:0.5,spd:1,  magic:0},
      Warrior: {hp:1,  atk:3,  def:0.3,spd:1.5,magic:0},
      Ranged:  {hp:1,  atk:1.5,def:0,  spd:1.5,magic:0},
      Heal:    {hp:1,  atk:0,  def:0.5,spd:0.5,magic:3},
      Mage:    {hp:0.8,atk:0.5,def:0,  spd:0.5,magic:3.5},
      Refugee: {hp:1,  atk:1,  def:0.5,spd:0.5,magic:0.5},
    }[cls]||{hp:1,atk:1,def:0.5,spd:0.5,magic:0.5};

    // 특성 우세 스탯: grow값이 높으면 배율 추가 (×1.5 보너스)
    const traitBoost=(growVal)=>growVal>=3?1.6:growVal>=2?1.3:1.0;

    // 특성 + 클래스 가중치 합산 (특성 우세 스탯은 추가 성장)
    const hpGrow  = Math.floor((trait.growHp   * clsGrow.hp  * traitBoost(trait.growHp))  * rnd(20,32));
    const atkGrow = Math.floor((trait.growAtk  * clsGrow.atk * traitBoost(trait.growAtk)) * rnd(2,6));
    const defGrow = +(trait.growDef  * clsGrow.def  * traitBoost(trait.growDef) * rndF(0.006,0.018)).toFixed(3);
    const spdGrow = +(trait.growSpd  * clsGrow.spd  * traitBoost(trait.growSpd) * rndF(0.012,0.045)).toFixed(3);
    const magGrow = Math.floor((trait.growMagic* clsGrow.magic* traitBoost(trait.growMagic))* rnd(1,5));

    // 기본 소량 성장 + 특성별 한계치 적용
    const cap=trait;
    u.maxHp   = Math.min((u.maxHp+hpGrow+rnd(10,18)), cap.capHp||9999);
    u.hp      = Math.min(u.hp+hpGrow+rnd(10,18), u.maxHp);
    u.bonusAtk= Math.min(u.bonusAtk+atkGrow+rnd(1,3), (cap.capAtk||200)-(BASE_ROLES[u.classKey||u.baseRole]?.atk||22));
    u.bonusDef= Math.min(+(u.bonusDef+defGrow+0.003).toFixed(3), cap.capDef||0.7);
    u.bonusSpd= Math.min(+(u.bonusSpd+spdGrow+0.005).toFixed(3), (cap.capSpd||3.5)-u.baseSpd);
    u.bonusMagic=Math.min(u.bonusMagic+magGrow, cap.capMagic||150);
    u.spd = +(u.baseSpd+u.bonusSpd).toFixed(2);

    const growSummary=`HP+${hpGrow+12} ATK+${atkGrow+1}${defGrow>0.005?` DEF+${Math.floor(defGrow*100)}%`:''}${spdGrow>0.01?` SPD+${spdGrow.toFixed(2)}`:''}${magGrow>0?` MAG+${magGrow}`:''}`;
    alog(`🎊 ${u.name} Lv.${u.lv}! (${TRAITS[u.traitKey||'balanced'].name}) ${growSummary}`);

    if(u.lv===5){u.maxSkillSlots=2;setTimeout(()=>showClassModal(u),300);}
    if(u.lv===10){u.maxSkillSlots=3;setTimeout(()=>showClassModal(u),300);}
    if(u.lv===20){u.maxSkillSlots=4;alog(`👑 ${u.name} Lv.20 — 스킬 슬롯 4개!`);}
  }
  addFloat(u.x>0?u.x:200,u.y>0?u.y:200,`+${actual}EXP`,'#3498db');
}

function closest(from,targets,maxR){
  let best=null,bd=maxR;
  targets.forEach(t=>{if(!t.dead&&t.hp>0){const d=dist(from,t);if(d<bd){bd=d;best=t;}}});
  return best;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function drawHexPath(x,y,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/6;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,CW,CH);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const h=hexMap[r][c],t=TERRAIN[h.type];
    drawHexPath(h.x,h.y,HR);ctx.fillStyle=t.color;ctx.fill();
    ctx.strokeStyle=t.border;ctx.lineWidth=0.7;ctx.stroke();
    if(t.sym){ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillText(t.sym,h.x,h.y);}
  }
  if(isPlacing){
    for(let r=0;r<ROWS;r++)for(let c=0;c<7;c++){
      const h=hexMap[r][c];drawHexPath(h.x,h.y,HR);
      ctx.fillStyle='rgba(91,45,130,0.15)';ctx.fill();ctx.strokeStyle='#5b2d82';ctx.lineWidth=0.6;ctx.stroke();
    }
  }
  allies.forEach(a=>{
    if(!a.isDeployed||a.hp<=0||a.dead||a.garrisoned)return;
    // 빈사 상태는 별도 표시 (아래에서 처리)

    const role=a.classKey||a.baseRole;
    const colorRoleDraw=a.class10Key?(CLASS10[a.class10Key]?.base||role):role;
    const rd=BASE_ROLES[colorRoleDraw]||BASE_ROLES[role];
    if(rd){
      const allSkillsMap={...BASE_SKILLS,...CLASS5_SKILLS};
      let skillRange=BASE_ROLES[role]?.range||65;
      if(a.activeSkills&&a.activeSkills.length){
        const maxSkillRange=Math.max(...a.activeSkills.map(s=>(allSkillsMap[s]?.range||skillRange)));
        skillRange=maxSkillRange;
      }
      skillRange+=(a.bonusRange||0);
      const isMapSel=a.id===_selectedUnitId;
      ctx.save();
      ctx.beginPath();ctx.arc(a.x,a.y,skillRange,0,Math.PI*2);
      // 선택된 유닛: 노란색 굵은 원
      ctx.strokeStyle=isMapSel?(rd.color+'ff'):(rd.color+(isBattle&&!isPaused?'88':'cc'));
      ctx.lineWidth=isMapSel?2.5:(isBattle&&!isPaused?1.5:2);
      ctx.setLineDash([5,4]);ctx.stroke();
      ctx.restore();
    }
    if(a.wx!==null){ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.wx,a.wy);ctx.strokeStyle='#f1c40f99';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.beginPath();ctx.arc(a.wx,a.wy,5,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();ctx.restore();}
  });
  if(dragUnit&&isDragging){ctx.save();ctx.beginPath();ctx.moveTo(dragUnit.x,dragUnit.y);ctx.lineTo(mouseX,mouseY);ctx.strokeStyle='#f1c40faa';ctx.lineWidth=1.5;ctx.setLineDash([5,3]);ctx.stroke();ctx.beginPath();ctx.arc(mouseX,mouseY,6,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();ctx.restore();}
  [...allies,...enemies].forEach(u=>{
    if(u.type==='ally'){
      if(!u.isDeployed)return;
      if(u.garrisoned||u.inStandby)return;
      // 빈사(dead but not permanently dead): 카운트다운 표시
      if(u.dead&&!u.permanentlyDead&&u.deathTime){
        const elapsed=Date.now()-u.deathTime;
        const left=Math.max(0,Math.ceil((7000-elapsed)/1000));
        const R=13;
        ctx.save();
        // 어두운 원
        ctx.beginPath();ctx.arc(u.x,u.y,R,0,Math.PI*2);
        ctx.fillStyle='rgba(50,0,0,0.85)';ctx.fill();
        ctx.strokeStyle='#e74c3c';ctx.lineWidth=2;
        // 남은 시간 원호
        ctx.beginPath();ctx.arc(u.x,u.y,R,- Math.PI/2,(2*Math.PI*((7000-elapsed)/5000))-Math.PI/2);
        ctx.strokeStyle='#e74c3c';ctx.lineWidth=3;ctx.stroke();
        // 카운트 숫자
        ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(left>0?left:'!',u.x,u.y);
        // "빈사" 텍스트
        ctx.font='7px Arial';ctx.fillStyle='#e74c3c';
        ctx.fillText('빈사',u.x,u.y+R+7);
        ctx.restore();
        return; // 일반 drawUnit 건너뜀
      }
      if(u.dead) return; // 영구사망
    }else{
      if(u.dead) return;
    }
    drawUnit(u);
  });
}
function drawUnit(u){
  const isAlly=u.type==='ally',R=13;
  const role=u.classKey||u.baseRole||'Melee';
  // class10Key를 가진 유닛은 CLASS10의 base role에서 색상 조회
  const colorRole=u.class10Key?(CLASS10[u.class10Key]?.base||role):role;
  const rd=BASE_ROLES[colorRole]||BASE_ROLES[role];
  ctx.save();
  if(isAlly&&u.onHold){ctx.beginPath();ctx.arc(u.x,u.y,R+5,0,Math.PI*2);ctx.strokeStyle='#a855f7';ctx.lineWidth=1.5;ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);}
  if(isAlly&&u.wx!==null){ctx.beginPath();ctx.arc(u.x,u.y,R+4,0,Math.PI*2);ctx.strokeStyle='#f1c40f66';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();ctx.arc(u.x,u.y,R,0,Math.PI*2);
  ctx.fillStyle=isAlly?(rd?.color||'#3498db'):u.color;ctx.fill();
  // 아군: 두꺼운 남색 테두리 / 적: 붉은 테두리
  if(isAlly){
    ctx.strokeStyle='#1a2a6c';ctx.lineWidth=3;ctx.stroke();
    // 안쪽 밝은 테두리
    ctx.beginPath();ctx.arc(u.x,u.y,R-1.5,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();
  }else{
    ctx.strokeStyle='#f88';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  const mark=isAlly?(u.class10Key?CLASS10[u.class10Key].name.slice(0,2):u.classKey||u.baseRole).slice(0,2):u.mark;
  ctx.fillText(mark,u.x,u.y);
  const bw=28,bh=3,bx=u.x-bw/2,by=u.y-R-6;
  ctx.fillStyle='#111';ctx.fillRect(bx,by,bw,bh);
  const pct=Math.max(0,u.hp/u.maxHp);
  // 선택된 유닛 HP바는 노란색
  const isMapSelected=isAlly&&u.id===_selectedUnitId;
  ctx.fillStyle=isMapSelected?'#f1c40f':(pct>0.5?'#2ecc71':pct>0.25?'#f39c12':'#e74c3c');
  ctx.fillRect(bx,by,bw*pct,bh);
  // 유닛 이름 (체력바 위)
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(u.x-14,by-10,28,9);
  ctx.fillStyle=isAlly?(rd?.color||'#fff'):'#ffaaaa';
  ctx.font='6px Arial';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText((u.name||'').slice(0,5),u.x,by-10);
  if(u.def>0.05){ctx.fillStyle='#60a5fa88';ctx.font='7px Arial';ctx.textAlign='center';ctx.fillText(`🛡${Math.floor(u.def*100)}%`,u.x,u.y+R+7);}
  // 특수 상태 표시
  if(!isAlly&&u.elite){ctx.fillStyle='#f1c40f';ctx.font='7px Arial';ctx.textAlign='center';ctx.fillText('★',u.x,u.y-R-8);}
  if(!isAlly&&u.ambushReady&&!u.ambushDone){ctx.fillStyle='#e74c3c';ctx.font='7px Arial';ctx.textAlign='center';ctx.fillText('❓',u.x,u.y-R-8);}
  if(!isAlly&&u.flees){ctx.fillStyle='#5d8a3c';ctx.font='7px Arial';ctx.textAlign='center';ctx.fillText('🏃',u.x,u.y-R-8);}
  ctx.restore();
}

// 주둔 유닛 추가
// 대기 프레임 드롭: 통솔유닛 or 주둔유닛 → 대기
/* --- [통합] 거점(사냥터)으로 드롭했을 때 (어디서든 -> 거점) --- */
window.zoneFrameDrop = function(e, zid) {
  e.preventDefault();
  const allyId = parseInt(e.dataTransfer.getData('ally-id'));
  const standbyId = parseInt(e.dataTransfer.getData('standby-uid'));
  const fromGzid = e.dataTransfer.getData('garrison-zid');
  const guid = parseInt(e.dataTransfer.getData('garrison-uid'));

  if (isBattle) { alog('❌ 전투 중에는 이동할 수 없습니다.'); return; }

  if (fromGzid && guid) {
    // 거점간 이동
    moveGarrisonUnit(fromGzid, guid, zid);
  } else if (allyId) {
    // 통솔 파티 -> 거점으로 이동
    sendToGarrison(allyId, zid);
  } else if (standbyId) {
    // 대기실 -> 거점으로 이동
    standbyToZone(standbyId, zid);
  }
};
window.standbyDragStart=function(e,id){

window.clickStandbyUnit=function(uid, evt){
  const u=allies.find(a=>a.id===uid);if(!u)return;
  document.querySelectorAll('.standby-popup').forEach(el=>el.remove());

  const cleared=Object.entries(zoneRecords).filter(([,r])=>r.cleared);

  const canParty=activeCount<PARTY_LIMIT;

  let html=`<div class="standby-popup" style="
    position:fixed;z-index:250;background:#0f1923;border:1px solid #1e3a5f;
    border-radius:8px;padding:10px;min-width:160px;box-shadow:0 4px 16px #000c;

  if(canParty){
    html+=`<div onclick="standbyToParty(${uid})" style="padding:8px;cursor:pointer;border-radius:4px;margin-bottom:4px;background:#1a3d1a;color:#2ecc71;touch-action:manipulation">🧑 통솔 파티로</div>`;
  }else{
    html+=`<div style="padding:6px;color:#555;font-size:10px;margin-bottom:4px">통솔 ${PARTY_LIMIT}명 꽉 참</div>`;
  }
  cleared.forEach(([zid])=>{
    const z=ZONES[zid]||{name:zid,color:'#aaa'};
    html+=`<div onclick="standbyToZone(${uid},'${zid}')" style="padding:8px;cursor:pointer;border-radius:4px;margin-bottom:4px;color:${z.color};background:#0a1520;touch-action:manipulation">${z.name}에 주둔</div>`;
  });
  html+=`<div onclick="document.querySelectorAll('.standby-popup').forEach(e=>e.remove())" style="padding:6px;cursor:pointer;color:#6b7280;margin-top:4px;text-align:center;touch-action:manipulation">✕ 취소</div>`;
  html+=`</div>`;
  document.body.insertAdjacentHTML('beforeend',html);

  // 이벤트 좌표 기반 위치 계산
  const pop=document.querySelector('.standby-popup');
  const pw=180, ph=200;
  let ex=0, ey=0;
  if(evt){
    if(evt.touches&&evt.touches[0]){ex=evt.touches[0].clientX;ey=evt.touches[0].clientY;}
    else if(evt.changedTouches&&evt.changedTouches[0]){ex=evt.changedTouches[0].clientX;ey=evt.changedTouches[0].clientY;}
    else{ex=evt.clientX||0;ey=evt.clientY||0;}
  }
  // 화면 밖으로 나가지 않도록
  const left=Math.max(4,Math.min(window.innerWidth-pw-4, ex-pw/2));
  const top=Math.max(4,Math.min(window.innerHeight-ph-4, ey+10));
  pop.style.left=left+'px';
  pop.style.top=top+'px';

  setTimeout(()=>{
    function closeOnOutside(e){
      if(!e.target.closest('.standby-popup')){
        document.querySelectorAll('.standby-popup').forEach(el=>el.remove());
        document.removeEventListener('click',closeOnOutside);
        document.removeEventListener('touchstart',closeOnOutside);
      }
    }
    document.addEventListener('click',closeOnOutside);
    document.addEventListener('touchstart',closeOnOutside);
  },100);
};

// 메인 루프

function markDirty(){_panelDirty=true;}

// [추가] 아군 유닛 간 겹침 방지 (상시 작동용)
function resolveOverlap() {
  // 전장에 배치된 살아있는 아군들만 필터링합니다.
  const aa = allies.filter(a => a.isDeployed && a.hp > 0 && !a.dead && !a.permanentlyDead);
  const SEP = 26; // 분리 유지 거리

  for (let i = 0; i < aa.length; i++) {
    for (let j = i + 1; j < aa.length; j++) {
      const a = aa[i], b = aa[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);

      // 거리가 SEP보다 가까우면 서로 밀어냅니다.
      if (d < SEP && d > 0.1) {
        const push = (SEP - d) * 0.3; 
        const nx = dx / d * push, ny = dy / d * push;
        
        a.x -= nx; a.y -= ny; 
        b.x += nx; b.y += ny;
        
        clampToMap(a); clampToMap(b); // 맵 경계 밖으로 나가지 않게 고정
        markDirty(); // 위치가 변했으므로 화면 갱신 요청
      }
    }
  }
}

  resolveOverlap();

  if(isBattle && !isPaused) battleTick();
  draw();
  _frameCount++;
  if(_panelDirty||(isBattle&&!isPaused&&_frameCount%30===0)){
    renderAllyPanel();
    renderEnemyPanel();
    _panelDirty=false;
  }
  // 자원 동기화: gold/food → res (혹시 레거시 코드가 변경했을 경우 대비)
  res.gold=gold; res.food=food;
  syncFromRes();
  
  // [✅ 수정 후] loop 함수 내부의 배틀 타이머 처리 구역
var bt = document.getElementById('battle-timer');
if (bt) {
  // 1. 항상 보이도록 설정

    var mm = Math.floor(total / 60), ss = total % 60;

  } else if (!isBattle) {
    document.getElementById('timer-clock').innerText = '⏱ 0:00';
  }

  // 3. 남은 적 숫자 (전투 전이라도 현재 생성된 적의 숫자를 표시)
  var activeEnemies = enemies.filter(e => !e.dead && e.hp > 0).length;
  document.getElementById('timer-enemy').innerText = '남은 적: ' + activeEnemies;
}

  if(_frameCount%20===0){
    if(_frameCount%120===0){checkCivUpgrade();}
    
    // 1. 상인이 없을 때: 단계별 타이머 노출 제어
    if (_frameCount % 60 === 0 && !_merchantPresent) {
      const sb = document.getElementById('shop-btn');
      if (sb) {
        if (civPhase === 1 && window._merchantNextTime) {
          // [마을 단계] 방문 예정 시간을 친절하게 노출
          const left = Math.max(0, Math.ceil((window._merchantNextTime - Date.now()) / 1000));
          const mm = Math.floor(left / 60), ss = left % 60;
          sb.style.display = 'inline';
          sb.innerHTML = `<span style="font-size:0.7em;color:#9ca3af;padding:2px 6px">🛒 상인 방문까지 ${mm > 0 ? mm + '분 ' : ''}${ss}초</span>`;
        } else {
          // [피난민 단계] 상인이 없으면 아무것도 보여주지 않음 (랜덤 컨셉)
          // [도시 단계] 도시에서는 상인이 상주하므로 이 블록(_merchantPresent가 false인 상황)에 거의 들어오지 않음
          sb.style.display = 'none';
        }
      }
    }

    // 2. 상인이 도착했을 때: 버튼 활성화 및 체류 시간 갱신 (지우지 말아야 할 줄)
    // 도시 단계(Phase 2) 미만에서 상인이 와 있는 동안에만 버튼을 계속 업데이트합니다.
    if (_frameCount % 60 === 0 && _merchantPresent && civPhase < 2) {
      updateMerchantBtn();
    }

    // 2. 기본 재원(골드/식량) 수치 갱신
    document.getElementById('gd').innerText=gold;
    document.getElementById('fd').innerText=food;

    // 3. 문명 단계별 재원 가시성 제어 (7번 요청 반영)
    const toggleDisplay = (id, condition) => {
      const el = document.getElementById(id);
      if (el && el.parentElement) {
        el.parentElement.style.display = condition ? 'inline' : 'none';
      }
    };

    // Phase 0 (피난민): 식량, 돌, 나무, 골드만 노출
    // Phase 1 (마을): + 철, 약초 추가
    // Phase 2 (도시): + 다이아몬드 추가
    toggleDisplay('r-iron', civPhase >= 1);
    toggleDisplay('r-herb', civPhase >= 1);
    toggleDisplay('r-diamond', civPhase >= 2);

    // 4. 각 재원 수치 갱신
    const setVal = (id, val) => { 
    const el = document.getElementById(id); 
    if(el) el.innerText = Math.floor(val || 0); };
    setVal('r-stone', res.stone);
    setVal('r-wood', res.wood);
    setVal('r-iron', res.iron);
    setVal('r-herb', res.herb);
    setVal('r-diamond', res.diamond);

    // 5. 날짜 레이블 갱신
    var dl = document.getElementById('day-label');
    if(dl){
      var isH = currentZone.tier==='hunt' || currentZone.tier==='pred';
      dl.innerText = (isH ? '🌿 사냥 ' : '⚔️ 전투 ') + zoneStage + '일차';
    }
  }
  requestAnimationFrame(loop);
}

// [무결점 버전] 스토리 인트로 실행 함수
window.showIntro = function() {
  console.log("인트로 시작 시도..."); // 디버깅용 메시지
  _introStep = 0;
  const modal = document.getElementById('intro-modal');
  if (!modal) {
    console.error("오류: #intro-modal 요소를 찾을 수 없습니다.");
    return;
  }

  const d = _introData[0];
  document.getElementById('intro-title').innerText = d.t;
  document.getElementById('intro-body').innerHTML = d.b;
  document.getElementById('intro-btn').innerText = d.btn;
  
  // 모달 표시
  modal.classList.add('show');

  // 버튼 이벤트 바인딩
  const btn = document.getElementById('intro-btn');
  btn.onclick = function() { window.introNext(); };
};

// 인트로 완료 시 안내 (3번 요청: 배치 방법만 안내)
function finishIntro() {
  document.getElementById('intro-modal').classList.remove('show');
  updatePG(); // <-- 여기서 호출
  window._tutorialStep = 'deploy';
}

window.introNext = function() {
  _introStep++;
  if (_introStep >= _introData.length) {
    finishIntro();
    return;
  }
  var d = _introData[_introStep];
  document.getElementById('intro-title').innerText = d.t;
  document.getElementById('intro-body').innerHTML = d.b;
  document.getElementById('intro-btn').innerText = d.btn;
};

window.skipIntro = function() {
  finishIntro();
};

function showIntro(){
  _introStep=0;
  var d=_introData[0];
  document.getElementById('intro-title').innerText=d.t;
  document.getElementById('intro-body').innerHTML=d.b;
  document.getElementById('intro-btn').innerText=d.btn;
  document.getElementById('intro-modal').classList.add('show');
  // onclick 대신 addEventListener로 바인딩 (iOS Safari 호환)
  var btn=document.getElementById('intro-btn');
  var newBtn=btn.cloneNode(true); // 기존 이벤트 제거
  btn.parentNode.replaceChild(newBtn,btn);
  newBtn.addEventListener('click',function(){window.introNext();});
  newBtn.addEventListener('touchend',function(e){e.preventDefault();window.introNext();});
}

// 드래그 시작 시 유닛 ID 저장
window.garrisonDragStart = function(e, fromZid, uid) {
  e.dataTransfer.setData("text/plain", JSON.stringify({ fromZid, uid }));
  e.dataTransfer.effectAllowed = "move";
};

// 드롭 처리 (사냥터 구역으로 이동)
window.onDropToZone = function(e, toZid) {
  e.preventDefault();
  const data = JSON.parse(e.dataTransfer.getData("text/plain"));
  const { fromZid, uid } = data;
  const u = allies.find(a => a.id === uid);
  if (!u) return;

  // 1. 기존 주둔지에서 제거 (있을 경우)
  if (fromZid && ZONES[fromZid]) {
    ZONES[fromZid].garrison = ZONES[fromZid].garrison.filter(g => g.id !== uid);
  }

  // 2. 새 주둔지에 추가
  if (!ZONES[toZid].garrison) ZONES[toZid].garrison = [];
  if (ZONES[toZid].garrison.length < 6) {
    ZONES[toZid].garrison.push({ id: u.id, lv: u.lv });
    u.garrisoned = true;
    u.inStandby = false;
    u.isDeployed = false;
    alog(`🚚 ${u.name} → ${ZONES[toZid].name} 이동`);
  } else {
    alog("⚠️ 해당 지역 주둔 인원이 가득 찼습니다!");
    // 인원이 꽉 찼으면 원래대로 (대기로 보내는 등 처리)
    u.inStandby = true;
  }
  
  renderGarrisonBar();
  renderAllyPanel();
  markDirty();
};
