<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>왕국 연대기 v6.0</title>
<style>
.rv { font-size:0.82em; } .rv span { color:#f1c40f; font-weight:bold; }
.rv span.g { color:#2ecc71; } .rv span.r { color:#e74c3c; } .rv span.fo { color:#e67e22; }
/* [수정] 상단 자원바 기본 설정 */
#top {
    width: 98%;
    max-width: 100% !important;
    background: #0f1923;
    border: 1px solid #1e3a5f;
    border-radius: 7px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 20px;
    
    /* [핵심] 모바일에서 겹침 방지 */
    position: sticky;
    top: 0;
    z-index: 1000; /* 최상단 유지 */
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* 경계 구분 */
}

.top-info-group {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}

.top-res-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

.logo { color:#f1c40f; font-weight:bold; font-size:0.95em; }

/* 추가로 각 자원(rv)의 간격을 미세 조정하고 싶다면 */
.rv {
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;    /* 자원 수치가 줄바꿈되지 않게 방지 */
}

.hint { margin-left:auto; font-size:9px; color:#374151; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: #080c10; color: #ccc; display: flex; flex-direction: column; align-items: center; padding: 6px; user-select: none; }
/* ── 상단 자원바 ── */
/* [수정] 컨트롤 바 - 상단바에 가려지지 않게 설정 */
#ctrl {
    position: relative;
    z-index: 900; /* 상단바(1000)보다 낮게 설정하여 자연스럽게 흐르게 함 */
    margin-top: 5px;
    display: flex;
    flex-direction: column;
    width: 98%;
    max-width: 100% !important;
    background: #0f1923;
    border: 1px solid #1e3a5f;
    border-radius: 7px;
    padding: 8px 10px;
    align-items: center;
}

/* [핵심 수정] 각 줄의 정렬 및 줄바꿈 방지 */
.ctrl-row {
  display: flex;
  flex-wrap: nowrap;        /* [중요] 모바일에서 요소들이 아래로 떨어지지 않게 강제 */
  gap: 4px;                 /* 간격을 촘촘하게 조정 */
  justify-content: center;
  align-items: center;
  width: 100%;
  overflow-x: auto;         /* 혹시라도 넘치면 가로 스크롤 허용 (최후의 수단) */
  scrollbar-width: none;    /* 스크롤바 숨기기 (Firefox) */
}
.ctrl-row::-webkit-scrollbar { display: none; } /* 스크롤바 숨기기 (Chrome/Safari) */

/* 버튼 내부 여백 미세 조정 (좁은 화면 대응) */
.ctrl-row .cb, .ctrl-row .badge {
  flex-shrink: 1;           /* 화면이 좁으면 버튼 크기가 줄어들도록 허용 */
  padding: 5px 6px;         /* 좌우 패딩 축소 */
  font-size: 10px;          /* 글자 크기 살짝 축소 */
  white-space: nowrap;      /* 글자 줄바꿈 방지 */
}

/* 6번째 자식(피난민 합류 버튼)부터 오른쪽 끝으로 밀어내기 */
#ctrl > :nth-child(6) {
  margin-left: auto !important;
}

/* [수정] 타이머 크기를 배지와 일치시키고 위아래 정렬 */
#battle-timer {
  display: flex;
  flex-direction: column; /* 위아래 두 줄 */
  justify-content: flex-end;
  align-items: flex-start;
  margin-left: 0px;      /* 배지와의 간격 */
  height: 28px;           /* [핵심] 일차수 배지 높이와 동일하게 설정 */
  line-height: 1.1;       /* 두 줄이 겹치지 않으면서 꽉 차게 조절 */
}

#timer-clock {
  font-size: 11px;        /* 시간을 조금 더 강조 */
  color: #f1c40f;         /* 시간은 노란색 */
  font-weight: bold;
}

#timer-enemy {
  font-size: 9px;         /* 적 숫자는 아래에 작게 */
  color: #f87171;         /* 적군은 붉은색 */
  font-weight: bold;
}

.badge { padding:4px 12px; border-radius:4px; font-weight:bold; font-size:0.75em; min-width:80px; text-align:center; }
.b-ba { background: #f1c40f !important; color: #111 !important; } /* 칼잡이 테마 */
.b-pl { background: #9b22db !important; } /* 주먹잡이 테마 (보라) */
.cb { padding:5px 10px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; font-size:0.75em; transition:filter 0.12s; white-space:nowrap; }
.cb:hover { filter:brightness(1.3); }
.cb-go{background:#7b1d1d} .cb-pa{background:#7d5a00} .cb-hi{background:#1a5c32} .cb-zo{background:#1a3d5c} .cb-fo{background:#5a3010}
/* [통합] 모든 상호작용 요소의 클릭 반응성 강제 강화 */
.cb, .skb, .ub, .zone-btn, .class-btn, .gz-unit, .gz-add, .collapse-btn {
  touch-action: manipulation !important; /* 모바일 터치 지연 0.3초 제거 */
  pointer-events: auto !important;       /* 클릭 신호 차단 해제 */
  user-select: none !important;          /* 꾹 눌렀을 때 텍스트 선택 방지 */
  -webkit-tap-highlight-color: transparent; /* 터치 시 생기는 파란 잔상 제거 */
}

/* ── 메인 레이아웃 ── */

#lay {
    width: 98%;           /* 양옆에 아주 미세한 여백만 남기고 꽉 채움 */
    max-width: 100% !important; /* 기존 1380px 제한을 강제로 해제 */
    margin: 0 auto 5px auto;
    display: flex;
    gap: 6px;
    align-items: flex-start;
    justify-content: center;
}

#center-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
}
.sp { 
    width:270px; 
    flex-shrink:0; 
    background:#0f1923; 
    border:1px solid #1e2d3d; 
    border-radius:7px; 
    padding:9px; 
    max-height:700px; 
    overflow-y:auto; 
    -webkit-overflow-scrolling:touch;
    
    /* [추가] 클릭 인식률 향상을 위한 설정 */
    position: relative;
    z-index: 100; 
    pointer-events: auto !important; 
}
.pt { font-size:0.82em; font-weight:bold; color:#f1c40f; margin-bottom:7px; border-bottom:1px solid #1e2d3d; padding-bottom:4px; }
/* ── 유닛 카드 ── */
.uc { background:#111d2b; border:1px solid #1e2d3d; border-radius:5px; padding:7px; margin-bottom:6px; font-size:11px; cursor:pointer; transition:border-color 0.15s; }
.uc:hover { border-color:#374151; } .uc.hold { border-color:#7b2f9e !important; background:#120b1e; }
.uc.selected {
  border-color: #f1c40f !important;
  background: rgba(241, 196, 15, 0.1) !important;
  box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
}
.uch { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.un { font-weight:bold; font-size:11px; } .ulv { font-size:9px; color:#f1c40f; }
.bw { width:100%; height:4px; background:#1e2d3d; border-radius:2px; margin:2px 0; overflow:hidden; }
.bf { height:100%; border-radius:2px; transition:width 0.3s; }
.hf{background:#27ae60} .ef{background:#2980b9}
.bl { font-size:9px; color:#374151; }
.sk-row { display:flex; gap:3px; flex-wrap:wrap; margin:3px 0; }
.skb { padding:2px 5px; border-radius:3px; border:1px solid #1e2d3d; background:#0f1923; color:#6b7280; font-size:9px; cursor:pointer; transition:all 0.1s; }
.skb:hover { border-color:#f1c40f; color:#f1c40f; } .skb.act { background:#f1c40f; color:#000; border-color:#f1c40f; font-weight:bold; } .skb.act span { color: #000 !important; }
.sl { font-size:9px; color:#374151; margin-bottom:2px; }
.ur { display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; }
.ub { flex:1; min-width:calc(33% - 3px); padding:3px 1px; border-radius:3px; border:1px solid #1e2d3d; background:#0f1923; color:#6b7280; font-size:8px; cursor:pointer; text-align:center; transition:all 0.12s; }
.ub:hover { background:#f1c40f; color:#000; border-color:#f1c40f; }
.ub.dimmed { opacity:0.45; cursor:not-allowed; }
.ub.dimmed:hover { background:#0f1923; color:#6b7280; border-color:#1e2d3d; }
.ec { background:#120808; border:1px solid #3d1010; border-radius:4px; padding:5px; margin-bottom:5px; font-size:10px; }
.etb { font-size:8px; padding:1px 4px; border-radius:2px; color:#fff; margin-left:3px; }
.log { height:75px; overflow-y:auto; background:#080c10; border:1px solid #1e2d3d; border-radius:3px; padding:4px; font-size:9px; color:#4ade80; margin-top:5px; }
.log.el { color:#f87171; } .ll { padding:1px 0; }
/* ── 지도 ── */
/* [수정] 지도 컨테이너와 캔버스의 유연한 크기 조절 */
/* [수정] 지도와 거점 바의 최대 너비를 확장 */
/* [수정] 지도 프레임과 거점 바의 제한도 해제 */
#mw, #garrison-bar {
    width: 100% !important;
    max-width: 100% !important; /* 1000px 제한 해제 */
}

#mw {
    position: relative;
    border: 1px solid #1e2d3d;
    border-radius: 7px;
    overflow: hidden;
    background: #060a0d;
    display: flex;
    justify-content: center;
}

canvas {
    width: 100% !important;
    height: auto !important;
    display: block;
}
/* [개선] 안내창(pg) 디자인: 가독성 및 테마 강화 */
#pg {
  position: absolute; 
  top: 50%; 
  left: 72%; 
  transform: translate(-50%, -50%);
  
  /* 디자인 변경: 반투명 네이비 + 골드 테두리 */
  background: rgba(15, 25, 35, 0.92); 
  color: #f1c40f;
  border: 1px solid #f1c40f;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(241, 196, 15, 0.2);
  
  padding: 12px 20px; 
  border-radius: 8px;
  font-size: 13px; 
  font-weight: bold;
  z-index: 1500; 
  display: none;
  text-align: center; 
  line-height: 1.6;
  max-width: 85%; 
  pointer-events: none; /* 클릭 방해 금지 */
}
/* [통합] 모달 배경 설정: 기존 디자인 유지 + 클릭 반응성 강화 */
.overlay { 
  display: none; 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(0, 0, 0, 0.9); 
  z-index: 9999; /* 다른 모든 요소보다 위에 표시 */
  align-items: center; 
  justify-content: center; 
  pointer-events: auto !important; /* 클릭 신호 강제 수용 */
  touch-action: none; /* 배경 스크롤 차단 */
}

/* [추가] 모달 내부 버튼들의 클릭 우선순위 높이기 */
.modal-box button, .class-btn, .cb {
  pointer-events: auto !important; /* 클릭 신호 강제 수용 */
  touch-action: manipulation;      /* 모바일 터치 반응 속도 향상 */
  cursor: pointer;
}

.overlay.show { 
  display: flex !important; /* show 클래스가 붙으면 무조건 표시 */
}
.modal-box { background:#0f1923; border:1px solid #f1c40f44; border-radius:10px; padding:20px; max-width:540px; width:90%; }
.modal-title { color:#f1c40f; font-size:1.1em; font-weight:bold; margin-bottom:10px; text-align:center; }
.modal-sub { color:#9ca3af; font-size:0.82em; margin-bottom:14px; text-align:center; }
.class-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
/* [수정] 첫 번째 줄만 이 코드로 교체하세요. 클릭 반응성과 터치 방해 요소를 제거합니다. */
.class-btn { 
  background:#111d2b; 
  border:1px solid #1e2d3d; 
  border-radius:7px; 
  padding:12px; 
  cursor:pointer; 
  transition:all 0.15s; 
  text-align:left; 
  
  /* [추가] 클릭 반응성 향상을 위한 핵심 속성 */
  touch-action: manipulation;      /* 모바일 클릭 딜레이 제거 */
  pointer-events: auto !important; /* 클릭 신호 강제 수용 */
  user-select: none;               /* 텍스트 선택으로 인한 클릭 씹힘 방지 */
}
.class-btn:hover { border-color:#f1c40f; background:#1a2a3d; }
.class-btn .cn { font-weight:bold; font-size:0.9em; margin-bottom:4px; }
.class-btn .cd { font-size:0.75em; color:#9ca3af; line-height:1.4; }
.class-btn .cs { font-size:0.72em; color:#60a5fa; margin-top:5px; }
/* ── 전투지 모달 ── */
.zone-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.zone-btn { background:#111d2b; border:2px solid #1e2d3d; border-radius:9px; padding:14px; cursor:pointer; transition:all 0.15s; text-align:center; }
.zone-btn:hover { border-color:#f1c40f; transform:translateY(-2px); }
.zone-btn .zn { font-size:1em; font-weight:bold; margin-bottom:5px; }
.zone-btn .zd { font-size:0.75em; color:#9ca3af; line-height:1.4; margin-bottom:6px; }
.zone-cur { font-size:9px; color:#f1c40f; margin-top:5px; }
.zr-hunt{background:#1a3d20;color:#2ecc71} .zr-bandit{background:#3d1010;color:#e74c3c}
/* ── 거점 현황 ── */
#garrison-bar {
    background: #0a1520;
    border: 1px solid #1e3a5f;
    border-radius: 7px;
}
#garrison-bar-header { display:flex; align-items:center; gap:10px; padding:6px 12px; cursor:pointer; background:#0f1923; }
#garrison-bar-header:hover { background:#111d2b; }
#garrison-bar-body { padding:8px; display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; }
.gz { background:#111d2b; border:1px solid #1e2d3d; border-radius:6px; padding:7px; min-width:160px; flex-shrink:0; }
.gz-title { font-size:10px; font-weight:bold; margin-bottom:4px; }
.gz-units { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:4px; min-height:22px; }
.gz-unit { padding:2px 6px; border-radius:3px; font-size:9px; border:1px solid #1e2d3d; background:#0f1923; cursor:grab; user-select:none; }
.gz-unit:hover { border-color:#f1c40f; }
.gz-unit.standby { border-color:#5b2d82; color:#a855f7; }
.gz-promote {
  animation: gz-pulse 1.5s infinite;
  background: rgba(241, 196, 15, 0.1) !important;
}

@keyframes gz-pulse {
  0% { box-shadow: 0 0 2px #f1c40f; border-color: #f1c40f; }
  50% { box-shadow: 0 0 8px #f1c40f; border-color: #fff; }
  100% { box-shadow: 0 0 2px #f1c40f; border-color: #f1c40f; }
}
.gz-unit[draggable="true"]:active {
  opacity: 0.5;
  cursor: grabbing;
}
.gz-unit.dead-10 { border-color:#e74c3c; color:#e74c3c; }
.gz-unit.dead-perm { border-color:#333; color:#555; opacity:0.6; }
.gz-income { font-size:9px; color:#2ecc71; margin-bottom:3px; }
.gz-add { font-size:9px; color:#f1c40f; cursor:pointer; padding:2px 5px; border:1px dashed #374151; border-radius:3px; margin-top:2px; }
.gz-add:hover { border-color:#f1c40f; }
/* ── 스크롤바 ── */
::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:#1e2d3d; border-radius:2px; }
/* ── 터치 최적화 ── */
button, .cb, .skb, .ub, .class-btn, .zone-btn, .gz-unit, .gz-add { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
/* ── 접기 버튼 ── */
.collapse-btn { font-size:10px; color:#f1c40f; cursor:pointer; padding:2px 8px; border:1px solid #1e2d3d; border-radius:3px; background:#0f1923; }
/* ── 간단히 보기 ── */
.compact-mode .sk-row,.compact-mode .ur,.compact-mode .sl { display:none !important; }
.compact-mode .uc { padding:4px 7px !important; margin-bottom:3px !important; }
.compact-mode .bw { margin:1px 0 !important; }
/* 3. 유닛 정보가 담긴 바디 영역 (스크롤 기준점) */
#panel-ally-body {
    padding-top: 5px; /* 헤더와 유닛 사이의 첫 간격만 살짝 부여 */
    overflow-y: auto;
    flex: 1;
}

/* [수정] 1번 요청: '함께하는 동료' 헤더가 유닛 카드 위로 올라오도록 설정 */
#panel-ally .pt {
    position: sticky;
    top: 0;
    z-index: 30; /* 유닛 카드(기본 z-index)보다 높게 */
    background: #0f1923; /* 뒤쪽 유닛이 보이지 않게 불투명 배경 설정 */
    margin: -9px -9px 7px -9px; /* 부모 패딩 상쇄 */
    padding: 10px 9px;
    border-bottom: 1px solid #1e2d3d;
}

/* -------------------------------------------------- */
/* ---------------- 브레이크포인트 구간 ---------------- */

/* (A) 850px 이상: 자원바가 한 줄로 들어오면 좌우로 찢어짐 */
@media (min-width: 850px) { 
  /* 1. 상단바 좌우 정렬 유지 */
  #top {
    justify-content: space-between; 
  }

  /* 2. 적 정보 사이드바 전체 너비를 200px로 강제 고정 */
  #panel-enemy {
    width: 200px !important;
    min-width: 200px !important;
    flex-shrink: 0;
  }

  /* 3. 적 리스트 컨테이너 (#el) 설정 */
  #el {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100% !important; /* 부모인 200px을 꽉 채움 */
  }

  /* 4. [핵심] 개별 적 카드(.ec) 폭 조절 */
  .ec {
    width: 100% !important;   /* 200px 내부에 꽉 차게 */
    box-sizing: border-box;  /* 패딩이 너비를 넘지 않도록 설정 */
    margin-bottom: 0 !important;
    padding: 8px !important;  /* 좁은 폭에 맞춰 패딩 살짝 축소 */
  }

  /* 카드 내부의 정보(텍스트, 게이지)가 삐져나가지 않도록 보정 */
  .ec-info {
    font-size: 10px; 
    overflow: hidden;
  }
}

/* (B) 1000px 이상: 컨트롤 버튼들을 가로로 한 줄 배치 */
@media (min-width: 1000px) {
  #ctrl {
    flex-direction: row;
    justify-content: space-between;
    padding: 8px 20px;
  }
  .ctrl-row {
    width: auto;
    gap: 8px;
    justify-content: flex-start;
  }
  .ctrl-row .cb, .ctrl-row .badge {
    padding: 5px 12px;
    font-size: 11px;
  }
}

/* (C) 1100px 이하: 모바일/패드 모드 (사이드바가 아래로 이동) */

function init(){
  canvas = document.getElementById('gc');
  ctx = canvas.getContext('2d');

  // 1. 캔버스의 내부 논리 해상도(좌표 계산용)는 고정합니다.
  canvas.width = CW; 
  canvas.height = CH;

  // 2. [교체 포인트] 고정된 style.width 대신 리사이즈 함수를 호출합니다.
  // 이 한 줄이 지도와 거점 현황의 너비를 칼같이 맞춰줍니다.
  resizeCanvas();
  
  currentZone=ZONES.hunt;
  buildMap(); spawnAllies(); spawnEnemies(); enterPlacement();
  canvas.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  // 터치 이벤트: canvas에만 preventDefault (window에 걸면 버튼 탭 차단됨)
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1)onDown(e.touches[0]);
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1)onMove(e.touches[0]);
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    if(e.changedTouches.length===1)onUp(e.changedTouches[0]);
  },{passive:false});
  // [수정] 키보드 입력 처리: 배치 중에는 시작, 전투 중에는 일시정지
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault(); // 스페이스바 입력 시 브라우저 스크롤 방지
      
      if (!isBattle && isPlacing) {
        // 1. 배치 완료 상태에서 스페이스바를 누르면 출발! 
        // 이전에 수정한 toggleBattle()이 실행되면서 안내창(pg)이 사라집니다.
        toggleBattle();
      } else if (isBattle) {
        // 2. 전투가 이미 시작된 상태라면 일시정지/재개 토글
        togglePause();
      }
    }
  });

  // 메인 루프 시작
  requestAnimationFrame(loop);

  // 주둔지 현황 기본 열림 및 UI 초기화
  const garrisonBody = document.getElementById('garrison-bar-body');
  if (garrisonBody) {
    garrisonBody.style.display = 'block';
  }
  
  renderGarrisonBar(); // 거점 정보 갱신
  resizeCanvas();      // 자원바 레이아웃에 맞춰 캔버스 크기 최종 조정
}

function showZoneModal(){
  if(isBattle&&!isPaused){alog('❌ 전투 중 변경 불가');return;}
  const totalLv=allies.reduce((s,a)=>s+a.lv,0);

  const visibleZones=Object.values(ZONES).filter(z=>(z.unlockPhase||0)<=civPhase);
  document.getElementById('zone-grid').innerHTML=visibleZones.map(z=>{
    const rec=zoneRecords[z.id]||{};
    const cleared=rec.cleared?'<span style="color:#2ecc71;font-size:9px">✅ 클리어</span>':'';
    const garr=rec.garrison&&rec.garrison.length>0?`<span style="color:#f1c40f;font-size:9px">🏕${rec.garrison.length}명</span>`:'';
    const unlock=totalLv>=(z.minLv||0);
    const lockMsg=!unlock?`<div style="color:#e74c3c;font-size:8px">🔒 총레벨 ${z.minLv} 필요 (현재 ${totalLv})</div>`:'';
    const rParts=[];
    if(z.rFood)  rParts.push(`🍖×${z.rFood}`);
    if(z.rWood)  rParts.push(`나무×${z.rWood}`);
    if(z.rStone) rParts.push(`돌×${z.rStone}`);
    if(z.rIron)  rParts.push(`철×${z.rIron}`);
    if(z.rHerb)  rParts.push(`🌿약초×${z.rHerb}`);
    if(z.rGold)  rParts.push(`💰×${z.rGold}`);
    if(z.rDiamond)rParts.push(`💠×${z.rDiamond}`);
    return `
    <div class="zone-btn" onclick="event.stopPropagation(); ${unlock?`selectZone('${z.id}')`:''}"
      style="border-color:${currentZone.id===z.id?z.color:'#1e2d3d'};opacity:${unlock?1:0.5};cursor:${unlock?'pointer':'not-allowed'}">
      <div class="zn" style="color:${z.color}">${z.name}</div>
      <div class="zd">${z.desc}</div>
      <div style="font-size:9px;color:#2ecc71;margin:3px 0">${rParts.join(' ')}</div>
      <div style="font-size:9px;color:#6b7280">${z.finalStage}일차 달성시 거점화 ${cleared}${garr}</div>
      ${lockMsg}
      ${currentZone.id===z.id?'<div class="zone-cur">✅ 현재</div>':''}
    </div>`;
  }).join('');
  document.getElementById('zone-modal').classList.add('show');
}

// 맵 생성
// ══════════════════════════════════════════════════════
function hexCenter(r,c){return{x:c*HW+(r%2)*HW*0.5+HR+5,y:r*HR*1.5+HR+5};}

// 간단한 시드 랜덤 (지형 고정용)
function seededRand(seed){
  let s=seed;
  return function(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};
}

// 존별 고정 지형 저장
const _fixedMaps={};

function buildMap(){
  hexMap=[];
  const zid=currentZone.id;
  // 이미 생성된 지형이면 재사용 (고정 지형)
  if(_fixedMaps[zid]){
    hexMap=_fixedMaps[zid].map(row=>row.map(cell=>({...cell})));
    return;
  }
  // 존 ID 기반 시드로 고정 지형 생성
  const seed=zid.split('').reduce((s,c)=>s+c.charCodeAt(0),42);
  const rndFn=seededRand(seed);
  const tier=currentZone.terrain||currentZone.tier; // 챕터 지형 테마 우선

  for(let r=0;r<ROWS;r++){
    hexMap[r]=[];
    for(let c=0;c<COLS;c++){
      const {x,y}=hexCenter(r,c);
      let type='plain';
      const v=rndFn();
      const v2=rndFn();

      if(tier==='hunt'){
        // 들판: 중앙에 작은 숲, 언덕, 강 한 줄기
        if(c===9&&r>=2&&r<=9) type='river';         // 가운데 강
        else if(c===10&&(r===4||r===5)) type='river';
        else if(c>5&&c<9&&v<0.35) type='forest';
        else if(c>10&&c<14&&v<0.30) type='forest';
        else if(c===7&&r>=1&&r<=3) type='hill';
        else if(c===12&&r>=8&&r<=10) type='hill';
        else if(c<4) type='plain'; // 아군 진영 평지
      }else if(tier==='pred'){
        // 숲+산: 울창한 숲, 산맥, 좁은 통로
        if(c>=1&&c<=3) type='plain';
        else if(c>=4&&c<=7&&v<0.55) type='forest';
        else if(c>=8&&c<=11){
          if(v<0.20) type='mountain';
          else if(v<0.55) type='forest';
          else if(v<0.65) type='hill';
        }else if(c>=12&&c<=15&&v<0.40) type='forest';
        else if(c>=16) type=(v<0.3)?'hill':'plain';
        // 산맥 라인
        if(c===10&&(r===2||r===3||r===8||r===9)) type='mountain';
        if(c===11&&(r===5||r===6)) type='mountain';
      }else if(tier==='bandit'){
        // 사막+돌산+협곡
        if(c>=1&&c<=3) type='plain';
        else if(c>=4&&c<=8){
          if(v<0.45) type='desert';
          else if(v<0.60) type='hill';
          else if(v<0.68) type='mountain';
        }else if(c>=9&&c<=13){
          if(v<0.30) type='mountain';
          else if(v<0.55) type='desert';
          else if(v<0.65) type='ruins';
        }else if(c>=14) type=(v<0.4)?'desert':'plain';
        // 강 협곡
        if(c===8&&r>=3&&r<=8) type='river';
        if(c===9&&(r===3||r===8)) type='river';
      }else{
        // 폐허+숲+언덕 복합
        if(c>=1&&c<=2) type='plain';
        else if(c>=3&&c<=6){
          if(v<0.30) type='ruins';
          else if(v<0.45) type='forest';
          else if(v<0.55) type='hill';
        }else if(c>=7&&c<=12){
          if(v<0.25) type='mountain';
          else if(v<0.40) type='ruins';
          else if(v<0.55) type='forest';
          else if(v<0.65) type='hill';
        }else if(c>=13) type=(v<0.35)?'hill':'plain';
        if(c===9&&r>=2&&r<=4) type='river';
        if(c===10&&r>=7&&r<=9) type='river';
      }
      hexMap[r][c]={type,x,y};
    }
  }
  // 고정 지형 저장
  _fixedMaps[zid]=hexMap.map(row=>row.map(cell=>({...cell})));
}

function nearestCell(x,y){
  let best=null,bd=Infinity;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const h=hexMap[r][c],d=(h.x-x)**2+(h.y-y)**2;if(d<bd){bd=d;best=h;}}
  return best;
}
function hasLOS(ax,ay,bx,by){
  for(let i=1;i<12;i++){const t=i/12,mx=ax+(bx-ax)*t,my=ay+(by-ay)*t;const cell=nearestCell(mx,my);if(cell&&TERRAIN[cell.type].blockLOS)return false;}
  return true;
}
function terrainAtkBonus(unit,cell){
  if(!cell)return 1.0;
  const role=unit.classKey||unit.baseRole||'Melee';
  const bonus=TERRAIN[cell.type].bonus[role];
  return(typeof bonus==='number'&&bonus>0)?bonus:1.0;
}
function terrainMoveCost(cell, role){
  if(!cell) return 10;
  const t=TERRAIN[cell.type];
  const spd=t.spd||1.0;
  // 기본 비용: 느릴수록 높음
  let cost=1.0/Math.max(spd,0.05);
  // 산: 근접은 매우 기피
  if(cell.type==='mountain'){
    const likesMtn=['Ranged','Sniper','Artillery'];
    cost=likesMtn.includes(role)?2.0:12.0;
  }
  // 강: 모두 극도로 기피 (우회 선호)
  if(cell.type==='river') cost=20.0;
  // 언덕: 원거리 선호, 나머지 약간 기피
  if(cell.type==='hill'){
    const likesHill=['Ranged','Sniper','Artillery'];
    cost=likesHill.includes(role)?0.9:1.5;
  }
  // 숲: 매복계 선호
  if(cell.type==='forest'){
    const likesForest=['Melee','Warrior','Rogue','Berserker2','Duelist'];
    cost=likesForest.includes(role)?0.7:1.8;
  }
  return cost;
}

function bestAdjacentCell(unit,targetX,targetY){
  const role=unit.classKey||unit.class10Key||unit.baseRole||'Melee';
  const baseAngle=Math.atan2(targetY-unit.y,targetX-unit.x);
  const candidates=[];
  // 7방향 탐색 (정면 ±108도) — 우회 경로를 찾을 수 있도록 넓게
  for(let i=-3;i<=3;i++){
    const ang=baseAngle+i*(Math.PI/6);
    const nx=unit.x+Math.cos(ang)*HW;
    const ny=unit.y+Math.sin(ang)*HR*1.5;
    const cell=nearestCell(nx,ny);
    if(!cell) continue;
    const moveCost=terrainMoveCost(cell,role);
    // 방향 보너스: 정면에 가까울수록 낮은 페널티
    const dirPenalty=Math.abs(i)*0.4;
    const score=moveCost+dirPenalty;
    candidates.push({x:nx,y:ny,cell,score});
  }
  if(!candidates.length) return null;
  candidates.sort((a,b)=>a.score-b.score);
  return candidates[0];
}

function rnd(min,max){return min+Math.floor(Math.random()*(max-min+1));}
function rndF(min,max){return +(min+Math.random()*(max-min)).toFixed(2);}

function mkAlly(name){
  // 랜덤 특성
  const traitKey=TRAIT_KEYS[Math.floor(Math.random()*TRAIT_KEYS.length)];
  const trait=TRAITS[traitKey];

  // 특성에 따라 기본 스탯 랜덤 설정
  const baseHp =rnd(420,580)+(trait.growHp >1?rnd(40,80):0);
  const baseAtk=rnd(16,28)  +(trait.growAtk>1?rnd(4,10):0);
  const baseDef=rndF(0.02,0.08)+(trait.growDef>1?rndF(0.02,0.06):0);
  const baseSpd=rndF(1.3,1.7)  +(trait.growSpd>1?rndF(0.1,0.3):0);
  const baseMag=trait.growMagic>1?rnd(5,15):0;

  return{
    id:uid++,name,x:-300,y:-300,wx:null,wy:null,
    spd:+baseSpd.toFixed(2),baseSpd:+baseSpd.toFixed(2),
    lv:1,exp:0,maxExp:100,
    hp:baseHp,maxHp:baseHp,
    def:+baseDef.toFixed(3),
    baseRole:'Refugee',classKey:null,class10Key:null,

    bonusAtk:baseAtk-22, // 기본 atk와의 차이를 bonusAtk에 흡수
    bonusDef:+Math.max(0,baseDef-0.05).toFixed(3),
    bonusSpd:0,bonusCDR:0,

/* --- resetDeployment 함수 전체 교체 --- */
function resetDeployment() {
  allies.forEach(a => {
    if (!a.dead && a.isDeployed) {
      // 1. 기억된 위치를 먼저 찾습니다.
      const pos = savedPositions[a.id] || initialPositions[a.id];
      
      if (pos) {
        a.x = pos.x;
        a.y = pos.y;
      } else {
        // 2. [수정] 기본 간격을 더 넓게(40px, 50px) 설정하여 뭉침을 확실히 방지합니다.
        // (a.id % 4)를 사용해 가로 4줄씩 바둑판 모양으로 배치합니다.
        a.x = 45 + (a.id % 4) * 40; 
        a.y = 70 + Math.floor(a.id / 4) * 55;
      }
      a.wx = null; a.wy = null;
    } else {
      a.isDeployed = false; // 사망자는 전장에서 확실히 제외합니다.
    }
  });
  markDirty(); // 화면 갱신 신호를 보냅니다.
}

      {name:n[3],mark:'K',color:'#6c2899',role:'Melee',
        x:bx+50,y:H*0.30,hp:Math.floor((700+rank*180)*diff), atk:Math.floor((70+rank*18)*diff),range:65,spd:1.1,def:0.20,etype:'king',elite:true},
      {name:n[4],mark:'K',color:'#6c2899',role:'Warrior',
        x:bx+50,y:H*0.70,hp:Math.floor((600+rank*160)*diff), atk:Math.floor((90+rank*22)*diff),range:75,spd:1.4,def:0.08,etype:'king',elite:true},
      {name:n[5],mark:'M',color:'#8e44ad',role:'Mage',
        x:bx+100,y:H*0.30,hp:Math.floor((450+rank*100)*diff),atk:Math.floor((100+rank*25)*diff),range:240,spd:0.5,def:0.05,etype:'king',elite:true},
      {name:n[6],mark:'M',color:'#8e44ad',role:'Mage',
        x:bx+100,y:H*0.70,hp:Math.floor((450+rank*100)*diff),atk:Math.floor((100+rank*25)*diff),range:240,spd:0.5,def:0.05,etype:'king',elite:true},
      {name:n[7],mark:'P',color:'#27ae60',role:'Heal',
        x:bx+140,y:H*0.50,hp:Math.floor((400+rank*100)*diff),atk:Math.floor((10)*diff),         range:210,spd:0.4,def:0.15,etype:'king',elite:true},
    ];
    return f.slice(0,Math.min(4+Math.floor(rank*0.5),f.length));
  }
  return[];
}

// 배치

// 배치 우선순위: 탱→힐→근딜(전사/전투가)→원딜→마법사→피난민
function deployPriority(a) {
  const role = a.classKey || a.baseRole;
  // 순서: 탱커(0) -> 힐러(1) -> 원거리(2) -> 전사/전투가/마법사(3) -> 피난민(4)
  const order = {
    Tank: 0, 
    Heal: 1, 
    Ranged: 2, 
    Melee: 3, Warrior: 3, Mage: 3, // 근딜 및 마법사는 3순위
    Refugee: 4
  };
  return order[role] ?? 5;
}
function getSortedUd(){
  return allies
    .filter(a=>!a.isDeployed&&!a.dead&&!a.permanentlyDead&&!a.inStandby&&!a.garrisoned)
    .sort((a,b)=>deployPriority(a)-deployPriority(b));
}
// [수정] enterPlacement 함수
function enterPlacement() {
  isPlacing = true; isBattle = false; isPaused = false;
  setBadge(currentZone.tier === 'hunt' || currentZone.tier === 'pred' ? '출발 준비' : '전투 준비', 'b-pl');
  
  document.getElementById('btn-go').style.display = 'inline-block';
  document.getElementById('btn-pa').style.display = 'none';

  // [수정 포인트] 무조건 안내창을 보이게 하고 상태를 업데이트합니다.
  const pg = document.getElementById('pg');
  if (pg) {
    pg.style.display = 'block'; 
    updatePG(); 
  }
  
  markDirty();
}
// [통합 버전] 안내 메시지 충돌 해결 및 가독성 개선
function updatePG() {
  const pg = document.getElementById('pg');
  if (!pg || isBattle) { 
    if (pg) pg.style.display = 'none';
    return;
  }

  const ud = getSortedUd(); // 배치 대기 중인 유닛 목록

  // 1. 모든 유닛 배치가 끝났을 때
  if (ud.length === 0) {
    if (autoStart) {
      pg.style.display = 'none';
    } else {
      pg.style.display = 'block';
      pg.style.border = '1px solid #2ecc71'; // 성공의 초록 테두리
      pg.innerHTML = `✅ <b style="color:#2ecc71">배치 완료!</b><br><span style="font-size:11px; color:#fff;">상단의 <b style="color:#e74c3c">▶ 출발!</b> or <b style="color:#e74c3c">스페이스 바</b>를 누르세요.</span>`;
    }
  } 
  // 2. 유닛 배치가 진행 중일 때
  else {
    const u = ud[0];
    const roleKey = u.classKey || u.baseRole;
    const classColor = BASE_ROLES[roleKey]?.color || '#f1c40f';

    // [계산 수정] 전체 인원수와 현재 배치 순서 도출
    const totalToDeploy = allies.filter(a => !a.dead && !a.permanentlyDead && !a.garrisoned && !a.inStandby).length;
    const remaining = ud.length; 
    const currentIndex = (totalToDeploy - remaining) + 1; // (전체 - 남은수) + 1 = 현재 순서

    pg.style.display = 'block';
    pg.style.border = '1px solid #f1c40f'; // 경고/안내의 금색 테두리
    
    // [통합] 지휘관님이 요청하신 "보라색 영역" 안내와 "현재 유닛" 정보를 합쳤습니다.
    pg.innerHTML = `
      📍 <b style="color:${classColor}; text-shadow: 1px 1px 2px #000;">${u.name}</b> 배치 중<br>
      <span style="font-size:11px; color:#ddd;">
        왼쪽의 <b style="color:#a855f7">보라색 영역</b>을 터치하세요.
        <span style="font-size:10px; color:#f1c40f;">(${currentIndex}/${totalToDeploy}) 배치 중</span>
      </span>`;
  }
}

// ══════════════════════════════════════════════════════
// 마우스
// ══════════════════════════════════════════════════════
let lastClickTime=0, lastClickUnit=null;
let _selectedUnitId=null; // 지도에서 클릭한 유닛 강조용
const DBL_CLICK_MS=300;

function getPos(e){
  const r = canvas.getBoundingClientRect();
  // 실제 픽셀(CW)과 화면에 보이는 크기(r.width)의 비율을 계산하여 좌표 보정
  const scaleX = CW / r.width;
  const scaleY = CH / r.height;
  return {
    x: (e.clientX - r.left) * scaleX,
    y: (e.clientY - r.top)  * scaleY
  };
}

function onDown(e){
  const {x,y} = getPos(e);
  const now = Date.now();
  dragSX=x; dragSY=y; isDragging=false;

  // [1] 이미 배치된 유닛 선택 및 홀드(더블클릭) 판정
  const clickedAlly = allies.find(a => a.isDeployed && !a.dead && dist(a, {x,y}) < 25);
  
  if (clickedAlly) {
    if (lastClickUnit === clickedAlly && (now - lastClickTime) < 300) {
      // 더블 클릭: 홀드 상태 토글
      clickedAlly.onHold = !clickedAlly.onHold;
      alog(`📍 ${clickedAlly.name}: ${clickedAlly.onHold ? '대기(Hold) 명령' : '자유 이동'}`);
      addFloat(clickedAlly.x, clickedAlly.y - 20, clickedAlly.onHold ? '🛑 HOLD' : '🏃 MOVE', '#a855f7');
      lastClickTime = 0; lastClickUnit = null; dragUnit = null;
    } else {
      // 싱글 클릭: 선택 및 드래그 준비
      _selectedUnitId = clickedAlly.id;
      dragUnit = clickedAlly;
      lastClickTime = now;
      lastClickUnit = clickedAlly;
    }
    renderAllyPanel(); 
    markDirty();
    return; 
  }

  // [2] 새 유닛 배치 로직 (삭제되었던 부분 복구 + 지능형 탐색 추가)
  const ud = getSortedUd();
  const targetCell = nearestCell(x, y);
  const isPurpleZone = hexMap.some(row => row.slice(0, 7).some(h => h === targetCell));

  if(ud.length > 0 && isPurpleZone){
    // 클릭한 칸이 다른 유닛의 복귀 지점(예약석)인지 확인
    const reserved = allies.find(a => 
      a.isDeployed && !a.dead && 
      (savedPositions[a.id]?.x === targetCell.x && savedPositions[a.id]?.y === targetCell.y)
    );

    let finalCell = targetCell;

    // 만약 자리가 이미 예약되어 있다면? 주변에서 가장 가까운 빈 칸 검색
    if(reserved) {
      let minD = Infinity;
      let bestEmptyCell = null;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < 7; c++) {
          const h = hexMap[r][c];
          const isTaken = allies.some(a => 
            a.isDeployed && !a.dead && 
            (savedPositions[a.id]?.x === h.x && savedPositions[a.id]?.y === h.y)
          );
          if(!isTaken) {
            const d = Math.hypot(h.x - x, h.y - y);
            if(d < minD) { minD = d; bestEmptyCell = h; }
          }
        }
      }
      if(bestEmptyCell) finalCell = bestEmptyCell;
      else { alog("⚠️ 배치 가능한 빈 공간이 없습니다!"); return; }
    }

    // 최종 확정된 칸에 배치
    const u = ud[0];
    u.x = finalCell.x; u.y = finalCell.y;
    u.isDeployed = true; u.wx = null; u.wy = null;
    
    savedPositions[u.id] = {x: u.x, y: u.y};
    initialPositions[u.id] = {x: u.x, y: u.y};
    
    _selectedUnitId = u.id;
    updatePG(); 
    renderAllyPanel();
    markDirty();

    // [핵심 추가] 배치가 끝났고 자동 시작이 ON이면 즉시 출발!
    if (autoStart && getSortedUd().length === 0) {
      setTimeout(() => { if(!isBattle && autoStart) toggleBattle(); }, 800);
    }
    return;
  }

  // [3] 빈 땅 클릭 시 선택 해제
  _selectedUnitId = null;
  lastClickUnit = null;
  renderAllyPanel();
  markDirty();
}

function onMove(e){
  const{x,y}=getPos(e);mouseX=x;mouseY=y;
  if(dragUnit&&!isDragging&&Math.hypot(x-dragSX,y-dragSY)>DRAG_T)isDragging=true;
}

function onUp(e){
  if (!dragUnit && e.target.tagName !== 'CANVAS') return;
  const {x, y} = getPos(e); 

  if(dragUnit){
    if(isDragging){
      // [드래그 중인 경우]
      if(!isBattle){
        // 1. 배치 단계: 지능형 빈자리 탐색
        const dropCell = nearestCell(x, y);
        const isReserved = allies.find(a => 
          a.id !== dragUnit.id && a.isDeployed && !a.dead &&
          (savedPositions[a.id]?.x === dropCell.x && savedPositions[a.id]?.y === dropCell.y)
        );

        let finalDropCell = dropCell;
        if(isReserved || !hexMap.some(row => row.slice(0, 7).some(h => h === dropCell))) {
          let minD = Infinity;
          let bestEmpty = null;
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < 7; c++) {
              const h = hexMap[r][c];
              const taken = allies.some(a => 
                a.id !== dragUnit.id && a.isDeployed && !a.dead &&
                (savedPositions[a.id]?.x === h.x && savedPositions[a.id]?.y === h.y)
              );
              if(taken) continue;
              const d = Math.hypot(h.x - x, h.y - y);
              if(d < minD) { minD = d; bestEmpty = h; }
            }
          }
          if(bestEmpty) finalDropCell = bestEmpty;
        }

        dragUnit.x = finalDropCell.x;
        dragUnit.y = finalDropCell.y;
        savedPositions[dragUnit.id] = {x: dragUnit.x, y: dragUnit.y};
        initialPositions[dragUnit.id] = {x: dragUnit.x, y: dragUnit.y};
        
        updatePG(); // 안내창 갱신

        // 배치가 모두 완료되었는지 확인 후 자동 시작
        if (autoStart && getSortedUd().length === 0) {
          setTimeout(() => { if(!isBattle && autoStart) toggleBattle(); }, 800);
        }
      } else {
        // 2. 전투 단계: 전술적 이동
        dragUnit.wx = Math.max(20, Math.min(CW - 20, x));
        dragUnit.wy = Math.max(20, Math.min(CH - 20, y));
        dragUnit.onHold = false;
        addFloat(dragUnit.wx, dragUnit.wy, '🎯 이동', '#f1c40f');
      }
    } else {
      // [단순 클릭인 경우] 전투 중 액티브 스킬 발동
      if (isBattle && !isPaused) {
        triggerActiveSkill(dragUnit); 
      }
    }
    markDirty();
  }
  dragUnit = null; 
  isDragging = false;
}

function triggerActiveSkill(u) {
  const ae = enemies.filter(e => e.hp > 0 && !e.dead);
  
  // [수정] 전문직업(class10Key)이 있다면 전용 스킬을 최우선 탐색
  let sk = null;
  if (u.class10Key) {
    sk = u.activeSkills.find(s => CLASS10_SKILLS[s]); 
  }
  if (!sk) sk = u.activeSkills.find(s => !['Guard', 'Arrow', 'Mend'].includes(s)) || u.activeSkills[0];

  const skData = CLASS10_SKILLS[sk] || BASE_SKILLS[sk] || CLASS5_SKILLS[sk];
  const tgt = closest(u, ae, (skData?.range || 200) + (u.bonusRange || 0));

  if (tgt && hasLOS(u.x, u.y, tgt.x, tgt.y)) {
    u.atkCd = Math.floor(u.atkCd * 0.4); 
    addFloat(u.x, u.y - 15, `⚡ ${skData.name}!`, '#f1c40f');
    alog(`⚔️ ${u.name}의 직접 지휘 공격: ${skData.name}`);
  } else {
    addFloat(u.x, u.y - 15, "사거리 밖", "#6b7280");
  }
}

// 드래그 이동을 처리하는 별도 함수
function executeMoveOrder(u, x, y) {
  if(!isBattle) {
    // 배치 단계: 기존 배치 로직 호출
    handlePlacementDrop(u, x, y); 
  } else {
    // 전투 단계: 웨이포인트 설정 및 홀드 해제
    u.wx = Math.max(20, Math.min(CW - 20, x));
    u.wy = Math.max(20, Math.min(CH - 20, y));
    u.onHold = false; // 이동 명령 시 홀드는 자동으로 풀립니다.
    addFloat(u.wx, u.wy, '🎯', '#f1c40f');
  }
}

let _classModalTimer=null;

function showClassModal(unit){
  pendingClass = unit;
  // 전투 중이어도 일시정지 안 함 — 창만 표시

  // [수정] 전직 창이 뜨면 게임을 일시정지하여 클릭 반응성을 확보합니다.
  if (isBattle) {
    isPaused = true;
    const goBtn = document.getElementById('btn-go');
    if (goBtn) {
      goBtn.innerText = '▶ 재개하기';
      goBtn.style.background = '#27ae60';
    }
  }

  let title,options;
  const role=unit.classKey||unit.baseRole||'Refugee';
  const rd=BASE_ROLES[role];
  const uAtk=(rd?.atk||22)+unit.bonusAtk;
  const uDef=Math.floor(unit.bonusDef*100);
  const uSpd=+unit.spd.toFixed(1);
  const uHp=unit.maxHp;
  const uMag=unit.bonusMagic||0;

  const pool=allies.filter(a=>!a.permanentlyDead);
  const n=Math.max(pool.length,1);
  const avgAtk=pool.reduce((s,a)=>{const r=a.classKey||a.baseRole;return s+(BASE_ROLES[r]?.atk||22)+a.bonusAtk;},0)/n;
  const avgDef=pool.reduce((s,a)=>s+Math.floor(a.bonusDef*100),0)/n;
  const avgSpd=pool.reduce((s,a)=>s+a.spd,0)/n;
  const avgHp =pool.reduce((s,a)=>s+a.maxHp,0)/n;

  function sc(label,val,avg,suffix=''){
    const ratio=avg>0?val/avg:1;
    const c=ratio>1.15?'#ff6b6b':ratio<0.85?'#60a5fa':'#9ca3af';
    return `<span style="color:${c};font-size:10px">${label}<b>${val}${suffix}</b></span>`;
  }
  const statLine=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
    ${sc('ATK:',uAtk,avgAtk)} ${sc('DEF:',uDef,avgDef,'%')}
    ${sc('SPD:',uSpd,avgSpd)} ${sc('HP:',uHp,avgHp)}
    ${uMag>0?sc('✨:',uMag,20):''}
  </div>`;

  if (unit.lv === 5) {
    title = `${unit.name} — 첫 번째 보직 선택`;
    
    // BASE_ROLES 객체에서 Refugee를 제외한 모든 직업을 자동으로 버튼으로 만듭니다.
    options = Object.entries(BASE_ROLES)
      .filter(([key]) => key !== 'Refugee') 
      .map(([key, data]) => ({
        key: key,
        name: `${data.mark} ${data.name}`,
        desc: data.desc,
        skills: `스킬: ${data.skillsSum}`
      }));
  }else if(unit.lv===10){
    title=`${unit.name} — 10레벨 세부 전직`;
    const cls10=Object.entries(CLASS10).filter(([,v])=>v.base===unit.classKey);
    options=cls10.map(([k,v])=>({key:k,name:v.name,desc:v.desc,skills:v.skills.map(s=>(BASE_SKILLS[s]||CLASS5_SKILLS[s]||{name:s}).name).join('/')}));
    if(!options.length)options=[{key:'__skip__',name:'현재 클래스 유지',desc:'변경 없음',skills:'—'}];
  }else{return;}

  const partyComp=allies.filter(a=>!a.garrisoned&&!a.inStandby&&!a.permanentlyDead&&a.id!==unit.id)
    .map(a=>{const r=a.classKey||a.baseRole;const rd2=BASE_ROLES[r];
      return `<span style="display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;background:#0f1923;border:1px solid ${rd2?.color||'#374151'};color:${rd2?.color||'#9ca3af'}">${a.name.slice(0,3)} Lv${a.lv}</span>`;
    }).join('');
  const partyHtml=partyComp?`<div style="margin-top:6px;font-size:9px;color:#6b7280">현재 파티: ${partyComp}</div>`:'';

  document.getElementById('modal-title').innerText=title;
  document.getElementById('modal-sub').innerHTML=
    `<span style="color:#a78bfa;font-size:10px">✦${TRAITS[unit.traitKey||'balanced'].name}</span> `+statLine+partyHtml;
  document.getElementById('modal-grid').innerHTML=options.map(o=>{
    const clsColor=BASE_ROLES[o.key]?.color||'#f1c40f';
      return `<div class="class-btn" onclick="event.stopPropagation(); selectClass('${o.key}')">      
      <div class="cn" style="color:${clsColor}">${o.name}</div>
      <div class="cd">${o.desc}</div>
      <div class="cs">스킬: ${o.skills}</div>
    </div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');

  // 15초 타임아웃 — 선택 없으면 '나중에'로 자동 닫기
  if(_classModalTimer)clearTimeout(_classModalTimer);
  let countdown=20;
  const closeBtn=document.querySelector('#modal .modal-box button[onclick*="modal"]');
  /* --- showClassModal 내부의 타이머 종료 로직 수정 --- */
  // (showClassModal 함수 내부의 tick 함수 부분)
  function tick(){
    const btn = document.querySelector('#modal .modal-box button');
    if(btn && btn.textContent.includes('나중에')) btn.textContent = `나중에 (${countdown}s)`;
    
    if(countdown <= 0){
      // [수정] 시간이 다 되면 자동으로 취소 함수 호출
      cancelClassModal();
      alog(`⏱ 선택 시간이 초과되어 전투를 재개합니다.`);
      return;
    }
    countdown--;
    _classModalTimer = setTimeout(tick, 1000);
  }
  _classModalTimer=setTimeout(tick,1000);
}
window.selectClass = function(key) {
  if(_classModalTimer){clearTimeout(_classModalTimer); _classModalTimer=null;}
  const u = pendingClass; if(!u) return;
  if(key === '__skip__'){document.getElementById('modal').classList.remove('show'); pendingClass=null; return;}

  if(u.lv === 5){
    u.classKey = key;
    u.maxSkillSlots = 2;

    // [자동 이름 부여] 직업 이름 + 현재 해당 직업 인원수+1
    const jobNum = allies.filter(a => a.classKey === key).length; 
    u.name = `${BASE_ROLES[key].name}${jobNum}`; 

    // [자동 스킬 부여] BASE_ROLES에 미리 정의해둔 초기 스킬을 가져옵니다.
    const ns = BASE_ROLES[key].initSkills || ['Arrow'];
    u.availableSkills = [...new Set([...u.availableSkills, ...ns])];
    u.activeSkills = ns.slice(0, 2);
    
    applyClassBonus(u, key, 1);
    alog(`🌟 ${u.name} 탄생! 전장에 투입할 준비가 되었습니다.`);
  } 
  
  document.getElementById('modal').classList.remove('show');
  setTimeout(() => showRenameModal(u), 200);
  markDirty();
};

  const shuffled = [...fullPool].sort(() => 0.5 - Math.random());

// [수정] 클래스별 전직 보너스 (새로운 6개 보직 대응)
function applyClassBonus(u, cls, tier){
  const t = tier === 1 ? 1 : 1.8; // 10레벨 전직 시 보너스 배율 상승
  
  switch(cls){
    case 'Tank': // 방패잡이
      u.bonusDef = Math.min(+(u.bonusDef + 0.08 * t).toFixed(3), 0.75);
      u.maxHp += Math.floor(120 * t); u.hp = Math.min(u.hp + Math.floor(120 * t), u.maxHp);
      alog(`🛡 ${u.name} 방어+${Math.floor(8 * t)}% HP+${Math.floor(120 * t)}`);
      break;
    case 'Warrior': // [추가] 주먹잡이: 공격력과 체력 균형 성장
      u.bonusAtk += Math.floor(15 * t);
      u.maxHp += Math.floor(60 * t); u.hp = Math.min(u.hp + Math.floor(60 * t), u.maxHp);
      alog(`🥊 ${u.name} 공격+${Math.floor(15 * t)} HP+${Math.floor(60 * t)}`);
      break;
    case 'Melee': // 칼잡이: 공격력과 치명적 속도
      u.bonusAtk += Math.floor(20 * t);
      u.bonusSpd = +(u.bonusSpd + 0.1 * t).toFixed(2);
      alog(`⚔️ ${u.name} 공격+${Math.floor(20 * t)} 속도+${(0.1 * t).toFixed(2)}`);
      break;
    case 'Ranged': // 돌팔매꾼
      u.bonusRange = (u.bonusRange || 0) + Math.floor(40 * t);
      u.bonusAtk += Math.floor(12 * t);
      alog(`🏹 ${u.name} 사거리+${Math.floor(40 * t)} 공격+${Math.floor(12 * t)}`);
      break;
    case 'Heal': // 약초꾼
      u.bonusRange = (u.bonusRange || 0) + Math.floor(30 * t);
      u.bonusMagic += Math.floor(20 * t);
      alog(`✨ ${u.name} 사거리+${Math.floor(30 * t)} 마법+${Math.floor(20 * t)}`);
      break;
    case 'Mage': // [추가] 점쟁이: 강력한 마법력 집중
      u.bonusMagic += Math.floor(35 * t);
      u.bonusCDR = Math.min(+(u.bonusCDR + 0.05 * t).toFixed(3), 0.5);
      alog(`🔮 ${u.name} 마법+${Math.floor(35 * t)} 쿨감+${Math.floor(5 * t)}%`);
      break;
  }
}

window.toggleSkill=function(id,sk){
  const u=allies.find(a=>a.id===id);if(!u)return;
  // 스킬 변경은 전투 중에도 항상 가능
  if(u.activeSkills.includes(sk)){
    if(u.activeSkills.length>1)u.activeSkills=u.activeSkills.filter(s=>s!==sk);
    else{alog('⚠️ 최소 1개 스킬 유지');return;}
  }else{
    if(u.activeSkills.length<u.maxSkillSlots)u.activeSkills.push(sk);
    else u.activeSkills=[...u.activeSkills.slice(1),sk];
  }
  const names=u.activeSkills.map(s=>(BASE_SKILLS[s]||CLASS5_SKILLS[s]||{name:s}).name);
  alog(`🔄 ${u.name} 스킬: ${names.join(', ')}`);
  markDirty();
};

// 강화 (전투 전/일시정지 중 가능, 실제 골드 소모)
// ══════════════════════════════════════════════════════
window.upgradeUnit = function(id, stat) {
  const u = allies.find(a => a.id === id);
  if (!u) return;
  const upg = UPGRADES[stat];
  if (!upg) return;
  
  // [추가] 강화 횟수 제한 체크 (능력치당 10번)
  if (!u.upgCount) u.upgCount = {atk:0, def:0, spd:0, hp:0, magic:0};
  const currentCount = u.upgCount[stat] || 0;
  
  if (currentCount >= 10) {
    alog(`⚠️ ${u.name}: ${upg.label} 강화 한계(10회)에 도달했습니다.`);
    addFloat(u.x > 0 ? u.x : 200, u.y > 0 ? u.y : 200, "MAX", "#e74c3c");
    return;
  }
  
  const cost = upg.cost(u.lv);
  if (res.gold < cost) { alog(`❌ 금화 부족 (필요:${cost}G)`); return; }
  
  res.gold -= cost; gold = res.gold;
  upg.apply(u);
  
  u.upgCount[stat] = currentCount + 1; // 횟수 증가
  
  if (stat === 'spd') u.spd = u.baseSpd + u.bonusSpd;
  
  alog(`${upg.label} ${u.name} 강화! (${u.upgCount[stat]}/10) → ${upg.cur(u)}${upg.unit}`);
  addFloat(u.x > 0 ? u.x : 200, u.y > 0 ? u.y : 200, `${upg.label}↑`, '#f1c40f');
  markDirty();
};

// [수정] 자원 보유량에 맞춰 영입 인원 조절
window.changeRefCount = function(delta) {
  const nextCount = _refCount + delta;
  const nextCost = nextCount * 30; // 1명당 식량 30 소모

  // 1. 숫자를 늘리려 할 때(delta > 0) 자원이 부족한지 체크

    addFloat(mouseX, mouseY, "식량 부족!", "#e74c3c");

  }

  // 2. 최소 1명 ~ 최대 10명 범위 내에서 수치 변경
  _refCount = Math.max(1, Math.min(10, nextCount));
  _updateRefModal();
};
function closeRefugeeModal(){document.getElementById('refugee-modal').classList.remove('show');}

  food-=cost;

}

/* --- spawnRefugee 함수 전체 교체 --- */
function spawnRefugee() {
  const nextChar = ALP[allies.length % 26]; // 알파벳 순서대로 이름 부여
  const u = mkAlly('피난민' + nextChar);
  u.activeSkills = ['Arrow'];
  allies.push(u); // 우선 전체 명단에 추가

  // [핵심 로직] 현재 실제로 활동 중인(통솔 중인) 파티원 수 계산
  const activeParty = allies.filter(a => 
    !a.dead && !a.permanentlyDead && !a.garrisoned && !a.inStandby && a.id !== u.id
  );

  if (activeParty.length < PARTY_LIMIT) {
    // 1. 파티 자리가 남은 경우: 즉시 통솔 파티로 합류
    u.inStandby = false;
    u.isDeployed = false; // 배치는 지휘관이 지도에서 직접 수행
    
    // 배치 안내창 활성화
    isPlacing = true;
    const pg = document.getElementById('pg');
    if (pg) pg.style.display = 'block';
    updatePG();
    
    alog(`👥 ${u.name}이(가) 통솔 파티에 합류했습니다. 배치를 완료하세요.`);
  } else {
    // 2. 파티가 꽉 찬 경우: 자동으로 대기실로 이동
    u.inStandby = true;
    u.isDeployed = false;
    u.x = -300; u.y = -300; // 지도 밖으로 위치 초기화
    
    alog(`⏳ 파티가 가득 차 ${u.name}이(가) 대기실에서 대기합니다.`);
  }

  markDirty(); // 파티창 갱신
  renderGarrisonBar(); // 하단 거점/대기 바 갱신
}

function flashPG() {
  const pg = document.getElementById('pg');
  if(!pg) return;
  let count = 0;
  const interval = setInterval(() => {
    // 테두리를 빨간색으로 깜빡이며 크기를 살짝 키웁니다.
    pg.style.borderColor = (pg.style.borderColor === 'red' ? '#f1c40f' : 'red');
    pg.style.transform = (count % 2 === 0) ? 'translate(-50%, -50%) scale(1.05)' : 'translate(-50%, -50%) scale(1)';
    count++;
    if(count > 6) {
      clearInterval(interval);
      pg.style.borderColor = '#f1c40f'; // 원래 금색으로 복구
      pg.style.transform = 'translate(-50%, -50%)';
    }
  }, 100);
}

// [무결점 버전] 전투 시작 및 일시정지 통합 제어
function toggleBattle(){
  // 1. 배치 체크: 대기 인원이 한 명이라도 있다면 시작을 차단합니다.
  const ud = getSortedUd();
  if (ud.length > 0) {
    if (typeof flashPG === 'function') flashPG(); // 안내창 깜빡임 경고
    alog("⚠️ 아직 배치하지 않은 대원이 있습니다! 배치를 먼저 완료하세요.");
    
    // 자동 시작 버튼을 '재개하기' 상태로 변경하여 유저가 인지하게 합니다.
    const goBtn = document.getElementById('btn-go');
    if (goBtn && autoStart) {
      goBtn.innerText = '▶ 재개하기';
      goBtn.style.background = '#27ae60';
    }
    return;
  }

  // 2. 이미 전투 중이라면 일시정지 기능으로 작동
  if(isBattle) {
    togglePause();
    return;
  }

  // [핵심 해결] 정의되지 않았던 변수들(foodCost, party)을 실시간 계산으로 대체
  const currentParty = allies.filter(a => a.isDeployed && !a.dead);
  const cost = currentParty.length * 2; // 출격 비용: 생존 대원 1명당 식량 2 소모

  if (res.food < cost) {
    alog(`❌ 식량이 부족합니다! (필요: ${cost}🍖 보유: ${Math.floor(res.food)}🍖)`);
    return;
  }

  // 3. 전투 시작 확정 및 자원 차감
  res.food -= cost;
  food = res.food;
  
  isPlacing = false;
  isBattle = true;
  isPaused = false;
  _battleStartTime = Date.now(); // [추가] 타이머 작동을 위해 시작 시간 기록

  const goBtn = document.getElementById('btn-go');
  if(goBtn) {
    goBtn.innerText = '❚❚ 일시정지'; 
    goBtn.style.background = '#8b0000'; // 빨간색 테마
  }
  
  const pg = document.getElementById('pg');
  if(pg) pg.style.display = 'none';

  setBadge(`${stage}일차`, 'b-ba');
  alog(`⚔️ 전투 시작! (파티원 ${currentParty.length}명, 식량 -${cost}🍖)`);
  markDirty();
}

function togglePause() {
  // [체크] 전투 중이 아니면 일시정지 기능은 작동하지 않습니다.
  if (!isBattle) {
    console.log("전투 중이 아니므로 일시정지를 무시합니다.");
    return;
  }

  isPaused = !isPaused; // 상태 반전
  
  const goBtn = document.getElementById('btn-go');
  const sb = document.getElementById('sb');

  if (isPaused) {
    // [일시정지 상태]
    if(goBtn) {
      goBtn.innerText = '▶ 재개하기';
      goBtn.style.background = '#27ae60'; // 초록색 (재개)
    }
    if (sb) sb.innerText = '잠시 멈춤';
    setBadge('잠시 멈춤', 'b-pa');
    alog('❚❚ 작전 일시 중지');
  } else {
    // [재개 상태]
    if(goBtn) {
      goBtn.innerText = '❚❚ 일시정지';
      goBtn.style.background = '#8b0000'; // 다시 빨간색
    }
    if (sb) sb.innerText = `${stage}일차`;
    setBadge(`${stage}일차`, 'b-ba');
    alog('▶ 작전 재개');
    
    // 일시정지 되었던 시간만큼 시작 시간을 뒤로 미뤄 타이머 유지
    if (_battleStartTime) {
        // 실제 구현 시 정지 기간 계산이 필요하지만, 여기서는 간략히 보정
    }
  }
  markDirty();
}

function toggleAutoStart(){
  autoStart = !autoStart;
  const btn = document.getElementById('btn-auto');
  const goBtn = document.getElementById('btn-go'); // [추가]
  const ud = getSortedUd(); // [추가]

  btn.innerText = `🔄 자동 시작: ${autoStart ? 'ON' : 'OFF'}`;
  btn.style.background = autoStart ? '#1a5c32' : '#1a4030';
  
  // [추가] 자동 진행을 켰는데 현재 배치 중인 유닛이 있다면 버튼을 '재개하기'로 변경
  if (autoStart && isPlacing && ud.length > 0 && goBtn) {
    goBtn.innerText = '▶ 재개하기';
    goBtn.style.background = '#27ae60';
  } else if (!autoStart && isPlacing && goBtn) {
    // 자동 진행을 끄면 다시 원래 '▶ 출발!' 버튼으로 복구
    goBtn.innerText = '▶ 출발!';
    goBtn.style.background = '#7b1d1d';
  }

  alog(autoStart ? '🔄 자동 진행 ON' : '🔄 자동 진행 OFF');
  if(autoStart && !isBattle && ud.length === 0){
    setTimeout(() => { if(autoStart && !isBattle) toggleBattle(); }, 500);
  }
}
function setBadge(t,cls){const b=document.getElementById('sb');b.innerText=t;b.className='badge '+cls;}

// [수정] 자동 진행을 강제로 켜기만 하는 함수 (중복 실행 방지 로직 포함)
function enableAutoStartOnly() {
  if (typeof autoStart !== 'undefined' && !autoStart) {
    toggleAutoStart();
  }
}

// ══════════════════════════════════════════════════════
// 전투 틱
// ══════════════════════════════════════════════════════
function battleTick(){
  // 빈사 5초 경과 시 영구 사망 처리
  const now=Date.now();
  allies.forEach(a=>{
    if(a.dead&&a.deathTime&&(now-a.deathTime)>=7000&&!a.permanentlyDead){
      a.permanentlyDead=true;
      a.isDeployed=false;
      a.inStandby=false;
      a.garrisoned=null;
      a.x=-999; a.y=-999;
      alog(`⚰️ ${a.name} 무덤으로...`);
      markDirty();
      renderGarrisonBar();
    }
  });
  const ae=enemies.filter(e=>e.hp>0&&!e.dead);
  const aa=allies.filter(a=>a.isDeployed&&a.hp>0&&!a.dead&&!a.permanentlyDead);

  aa.forEach(a=>{
    const cell=nearestCell(a.x,a.y);
    const terrSpd=cell?TERRAIN[cell.type].spd:1.0;

    // 방어 패시브
    let defBonus=0;
    if(a.activeSkills.includes('Guard')||a.activeSkills.includes('Fortress'))defBonus=0.3;
    if(a.activeSkills.includes('Fortress'))defBonus=0.6;
    a.def=Math.min(a.bonusDef+defBonus,0.75);

    // Guard: 인근 아군 방어 버프
    if((a.activeSkills.includes('Guard')||a.activeSkills.includes('Fortress'))&&Math.random()>0.97){
      aa.filter(x=>x!==a&&dist(a,x)<80).forEach(x=>x.def=Math.max(x.def,0.1));
    }

    // ── 공속 쿨다운 시스템 ──
    const role=a.classKey||a.baseRole;
    const roleData=BASE_ROLES[role];
    const baseAtkSpd=(roleData?.atkSpd||0.8)*(1+(a.bonusCDR||0));
    const castDelay=roleData?.castDelay||0;
    const cooldownFrames=Math.max(6, Math.floor(60/baseAtkSpd)+castDelay);
    if(a.atkCd===undefined)a.atkCd=Math.floor(Math.random()*cooldownFrames);
    if(a.atkCd>0){
      // 마법사 캐스팅 중 표시
      if(role==='Mage'&&a.atkCd===Math.floor(castDelay/2)){
        addFloat(a.x,a.y-18,'✨시전중...','#00bcd4');
      }
      a.atkCd--;
    }
    else{
      a.atkCd=cooldownFrames;
      // 마법사 스킬 발동 이펙트
      if(role==='Mage') addFloat(a.x,a.y-20,'💥','#00bcd4');
      a.activeSkills.forEach(sk=>{
        const skData=BASE_SKILLS[sk]||CLASS5_SKILLS[sk];if(!skData)return;
        if(sk==='Mend'||sk==='Barrier'||sk==='Revive'){
          if(sk==='Revive'){
            const now=Date.now();
            // 5초 이내 빈사 → 시간 촉박한 순 정렬
            const dying=allies.filter(x=>x.dead&&x.isDeployed&&x.deathTime&&(now-x.deathTime)<7000);
            dying.sort((x,y)=>x.deathTime-y.deathTime); // 먼저 쓰러진 순
            const dead=dying.find(x=>dist(a,x)<(210+(a.bonusRange||0)));
            if(dead){
              dead.hp=Math.floor(dead.maxHp*0.3);dead.dead=false;dead.deathTime=null;
              deadUnits=deadUnits.filter(d=>d.id!==dead.id);
              alog(`✨ ${a.name} → ${dead.name} 응급 소생!`);addFloat(dead.x,dead.y,'소생!','#a855f7');
              renderGarrisonBar();
            }
          }else{
            const tgt=aa.filter(x=>x!==a&&x.hp<x.maxHp).sort((x,y)=>x.hp-y.hp)[0];
            if(tgt){
              const range=(skData.range||210)+(a.bonusRange||0);
              if(dist(a,tgt)<range&&hasLOS(a.x,a.y,tgt.x,tgt.y)){
                const val=Math.floor((22+a.bonusAtk)*(1+(a.bonusMagic||0)*0.025)*skillMult(a,sk));
                const shield=sk==='Barrier'?Math.floor(val*0.5):0;
                const actualHeal=Math.min(tgt.maxHp-tgt.hp,val);
                tgt.hp=Math.min(tgt.maxHp,tgt.hp+val);
                if(shield){tgt.def=Math.min(tgt.def+0.15,0.75);a.totalAbsorb+=shield;}
                a.totalHeal+=actualHeal;
                addFloat(tgt.x,tgt.y-15,`+${val}`,'#a855f7');
                if(actualHeal>0){gainExp(a,Math.floor(actualHeal/4));useSkill(a,sk);}
              }
            }
          }
        }else{
          if(sk==='Cleave'){ae.filter(e=>dist(a,e)<(skData.range||75)).forEach(tgt=>{if(hasLOS(a.x,a.y,tgt.x,tgt.y))applyDmg(a,tgt,cell,sk);});return;}
          if(sk==='Volley'){const tgt=closest(a,ae,(skData.range||220)+(a.bonusRange||0));if(tgt&&hasLOS(a.x,a.y,tgt.x,tgt.y))for(let i=0;i<3;i++)applyDmg(a,tgt,cell,sk,0.5);return;}
          const tgt=closest(a,ae,(skData.range||65)+(a.bonusRange||0));
          if(tgt){
            const needLOS=(sk==='Arrow'||sk==='Highland'||sk==='Volley');
            if(!needLOS||hasLOS(a.x,a.y,tgt.x,tgt.y))applyDmg(a,tgt,cell,sk);
          }
        }
      });
    }

    // 이동 (홀드 아닐 때)
    if(!a.onHold) moveAlly(a,ae,aa,terrSpd);
    // 아군도 경계 클램프
    clampToMap(a);
  });

  // 적 행동
  ae.forEach(e=>{
    // 공속 쿨다운
    if(e.atkCd===undefined)e.atkCd=0;
    if(e.atkCd>0)e.atkCd--;
    const canAtk=e.atkCd<=0;
    const atkCooldown=Math.max(6, Math.floor(60/(e.atkSpd||0.7)));

    // ── 힐러: 아군 치료 + 후방 유지 ──
    if(e.role==='Heal'){
      if(canAtk){
        e.atkCd=atkCooldown;
        const healAmt=20+stage*3+(e.elite?15:0);
        const wounded=ae.filter(x=>x!==e&&x.hp<x.maxHp&&dist(e,x)<e.range).sort((a,b)=>a.hp-b.hp)[0];
        if(wounded){wounded.hp=Math.min(wounded.maxHp,wounded.hp+healAmt);addFloat(wounded.x,wounded.y-12,`+${healAmt}`,'#27ae60');}
      }
      const nearAlly=ae.filter(x=>x!==e&&x.hp>0&&!x.dead).sort((a,b)=>dist(e,a)-dist(e,b))[0];
      if(nearAlly){const d2=dist(e,nearAlly);if(d2<80){const dx=e.x-nearAlly.x,dy=e.y-nearAlly.y,dn=Math.hypot(dx,dy);if(dn>0){e.x+=dx/dn*e.spd*0.5;e.y+=dy/dn*e.spd*0.5;}}}
      e.x=Math.max(MAP_PAD,Math.min(CW-MAP_PAD,e.x));e.y=Math.max(MAP_PAD,Math.min(CH-MAP_PAD,e.y));
      return;
    }

    // ── 사냥터 초식: 배회 + 아군 인지 시 도망 ──
    if(e.flees){
      const nearest=closest(e,aa,Infinity);
      const d=nearest?dist(e,nearest):Infinity;
      if(d<180){
        // 아군 인지 → 도망 (구석 막혀도 최선의 방향으로 이동)
        const dx=e.x-nearest.x,dy=e.y-nearest.y,dn=Math.hypot(dx,dy);
        const baseAngle=dn>0?Math.atan2(dy,dx):Math.random()*Math.PI*2;
        // 8방향 중 맵 안으로 가장 멀리 갈 수 있는 방향 선택
        let bestAngle=baseAngle,bestScore=-Infinity;
        for(let i=0;i<8;i++){
          const ang=baseAngle+(i*Math.PI/4);
          const nx=e.x+Math.cos(ang)*e.spd*5;
          const ny=e.y+Math.sin(ang)*e.spd*5;
          const inBounds=nx>MAP_PAD&&nx<CW-MAP_PAD&&ny>MAP_PAD&&ny<CH-MAP_PAD;
          const score=(inBounds?10:0)+Math.cos(ang-baseAngle)*5;
          if(score>bestScore){bestScore=score;bestAngle=ang;}
        }
        e.x+=Math.cos(bestAngle)*e.spd;
        e.y+=Math.sin(bestAngle)*e.spd;
        // 맵 우측 끝까지 도망하면 사망 처리
        if(e.x>=CW-MAP_PAD&&d<60){e.hp=0;e.dead=true;elog(`🏃 ${e.name} 도망침!`);return;}
        // 간혹 반격
        if(d<55&&canAtk){e.atkCd=atkCooldown;const r=Math.floor(e.atk*(1-Math.min(nearest.def,0.75)));nearest.hp-=r;addFloat(nearest.x,nearest.y-12,`-${r}`,'#ff6b6b');if(nearest.hp<=0)nearest.dead=true;}
      }else{
        // 아군 미인지 → 랜덤 배회
        e.wanderTimer=(e.wanderTimer||0)-1;
        if(e.wanderTimer<=0){
          e.wanderAngle=(e.wanderAngle||0)+(Math.random()-0.5)*1.2;
          e.wanderTimer=30+Math.floor(Math.random()*40);
        }
        e.x+=Math.cos(e.wanderAngle)*e.spd*0.6;
        e.y+=Math.sin(e.wanderAngle)*e.spd*0.6;
      }
      // 4방향 모두 경계 막기
      e.x=Math.max(MAP_PAD,Math.min(CW-MAP_PAD,e.x));
      e.y=Math.max(MAP_PAD,Math.min(CH-MAP_PAD,e.y));
      return;
    }

    // ── 악당 기습병: 매복 대기 → 접근하면 갑자기 돌격 ──
    if(e.ambushReady&&!e.ambushDone){
      const nearest=closest(e,aa,Infinity);
      if(!nearest||dist(e,nearest)>180){
        e.x=Math.max(MAP_PAD,Math.min(CW-MAP_PAD,e.x));
        e.y=Math.max(MAP_PAD,Math.min(CH-MAP_PAD,e.y));
        return;
      }
      e.ambushDone=true;
      addFloat(e.x,e.y,'⚡기습!','#e74c3c');
      alog(`⚡ ${e.name} 기습 발동!`);
      e.ambushTarget=aa.find(a=>(a.baseRole==='Heal'||a.baseRole==='Ranged')&&a.hp>0&&!a.dead)||nearest;
    }

    // 도발 체크
    const taunter=aa.find(a=>a.activeSkills.includes('Taunt')&&dist(a,e)<120);
    let tgt=taunter||null;
    if(!tgt&&e.ambushDone&&e.ambushTarget&&!e.ambushTarget.dead&&e.ambushTarget.hp>0)tgt=e.ambushTarget;
    if(!tgt){
      if(e.role==='Ranged')tgt=aa.find(a=>(a.baseRole==='Heal'||a.baseRole==='Ranged')&&a.hp>0&&!a.dead)||closest(e,aa,Infinity);
      else tgt=closest(e,aa,Infinity);
    }
    if(!tgt){
      e.x=Math.max(MAP_PAD,Math.min(CW-MAP_PAD,e.x));
      e.y=Math.max(MAP_PAD,Math.min(CH-MAP_PAD,e.y));
      return;
    }

    const d=dist(e,tgt);
    if(d<e.range){
      if(canAtk){
        e.atkCd=atkCooldown;
        const los=e.role==='Ranged'?hasLOS(e.x,e.y,tgt.x,tgt.y):true;
        if(los){
          const raw=e.atk;
          const reduced=Math.floor(raw*(1-Math.min(tgt.def,0.75)));
          if(tgt.def>0.1){const absorbed=raw-reduced;tgt.totalAbsorb=(tgt.totalAbsorb||0)+absorbed;if(absorbed>0)gainExp(tgt,Math.floor(absorbed/5));}
          tgt.hp-=reduced;
          addFloat(tgt.x,tgt.y-12,`-${reduced}`,'#ff6b6b');
          if(tgt.hp<=0){
            tgt.dead=true;
            tgt.deathTime=Date.now();
            alog(`💀 ${tgt.name} 전사`);
            deadUnits.push({...tgt, deathTs:Date.now()});
            renderGarrisonBar();
          }
        }else{addFloat(e.x,e.y,'시야차단','#888');}
      }
    }else{
      e.x+=(tgt.x-e.x)/d*e.spd;
      e.y+=(tgt.y-e.y)/d*e.spd;
    }
    // 경계 클램프 (모든 적)
    e.x=Math.max(MAP_PAD,Math.min(CW-MAP_PAD,e.x));
    e.y=Math.max(MAP_PAD,Math.min(CH-MAP_PAD,e.y));
  });

  // ── 종료 처리 ──
  if(ae.every(e => e.hp <= 0 || e.dead)){
    const base = 10 + zoneStage * 4;
    const isH = currentZone.tier === 'hunt' || currentZone.tier === 'pred';
    
    // 자원 획득 로직 (생략된 기존 계산 유지)
    const fR = Math.floor(base * (currentZone.rFood || 0) / 3); 
    const gR = Math.floor(base * (currentZone.rGold || 0));
    // ... (다른 자원들 계산) ...

    food += fR; gold += gR;
    res.food = food; res.gold = gold;
    // ... (res 반영) ...

    const rlog = (fR ? ` 🍖+${fR}` : '') + (gR ? ` 💰+${gR}` : '');
    alog(`✅ ${isH ? '사냥' : '전투'} ${zoneStage}일차 승리!${rlog}`);

    // [수정] 대원 완치 및 정비
    allies.forEach(a => {
      if (!a.permanentlyDead && !a.inStandby && !a.garrisoned) {
        a.hp = a.maxHp; a.dead = false; a.deathTime = null;
        if (a.x > 0) a.isDeployed = true;
      }
    });

    aa.forEach(a => gainExp(a, 20 + zoneStage * 3));

    // [핵심] 파이널 스테이지(Day 15) 체크 로직 추가
    if (zoneStage >= (currentZone.finalStage || 15)) {
      isBattle = false;
      
      // 구역 클리어 기록 저장
      if (!zoneRecords[currentZone.id]) zoneRecords[currentZone.id] = { cleared: false, garrison: [] };
      zoneRecords[currentZone.id].cleared = true;
      zoneRecords[currentZone.id].clearTime = Date.now() - _battleStartTime;
      zoneRecords[currentZone.id].totalReward = { food: fR * 15, gold: gR * 15 }; // 주둔 수익 기준점 설정

      alog(`🎊 [${currentZone.name}] 정복 완료! 거점을 구축합니다.`);
      
      // 1초 후 거점 배치 모달 호출
      setTimeout(() => {
        if (typeof showGarrisonModal === 'function') {
          showGarrisonModal(currentZone.id);
        }
      }, 1000);
      return; 
    }

    // 일반적인 다음 날 준비
    zoneStage++; stage = zoneStage; isBattle = false;
    resetDeployment(); buildMap(); spawnEnemies();

    setTimeout(() => {
      // 1일차 튜토리얼 또는 일반 배치 모드 진입 로직 유지
      if (stage === 2 && !_tutorialShown) {
        showDay1Tutorial();
      } else {
        enterPlacement();
      }
      renderGarrisonBar();
    }, 300);
    return;
  } else {
    // [수정] 아군 전멸 판정 정밀 로직
    // 1. 현재 전장에서 싸울 수 있는 아군이 있는지 확인
    const liveAllies = allies.filter(a => a.isDeployed && !a.dead && a.hp > 0);

    if (isBattle && liveAllies.length === 0) {
      isBattle = false; // 즉시 전투 중지
      isPlacing = false;

      // 2. [핵심 수정] 모든 배치된 대원을 전멸 상태로 정리
      allies.forEach(a => {
        if (a.isDeployed) {
          a.hp = 0;
          a.dead = true;
          a.isDeployed = false; // 전장에서 제거
          
          // [수정] deathTime을 null로 설정하여 무덤 창의 7초 카운트다운을 멈춥니다.
          a.deathTime = null; 
          
          // 전멸 시에도 사망 기록은 남깁니다.
          deadUnits.push({ ...a, deathTs: Date.now() }); 
        }
      });

      // 3. 적들의 타겟 초기화 및 패배 모달 출력
      enemies.forEach(e => { e.target = null; e.isAttacking = false; });

      setTimeout(() => {
        alog("💀 부대가 전멸했습니다. 지휘관님, 정비가 필요합니다.");
        showDefeatModal();   // 패배/재기 모달 호출
        renderGarrisonBar(); // 무덤 현황 갱신 (이제 카운트다운 없이 '전사'로 표시됨)
      }, 500);
      
      markDirty();
      return;
    }
  }
}

function showDefeatModal(){
  const HIRE_COST=30; // 피난민 1명 고용 비용(식량)
  const garrison=Object.values(zoneRecords).flatMap(r=>r.garrison||[]);
  const garrisonAllies=garrison.map(g=>allies.find(a=>a.id===g.id)).filter(Boolean);
  const activeCount=allies.filter(a=>!a.permanentlyDead&&!a.garrisoned).length;

  // 게임 오버 조건: 통솔 가능 유닛 없음 + 거점 유닛도 없음 + 식량 부족
  const canHireNew=res.food>=HIRE_COST;
  const hasGarrisonUnits=garrisonAllies.length>0;

  // 거점 피난민이 있으면 복귀시킬 수 있음
  if(hasGarrisonUnits||canHireNew){
    // 전멸 모달 표시
    let bodyHtml=`<div style="font-size:11px;color:#9ca3af;margin-bottom:12px">
      모두 쓰러졌습니다. 💀 경험치는 보존됩니다.
    </div>`;
    if(hasGarrisonUnits){
      bodyHtml+=`<div style="font-size:10px;color:#2ecc71;margin-bottom:8px">
        🏕 거점 대원 ${garrisonAllies.length}명이 복귀할 수 있습니다.
      </div>`;
    }
    if(canHireNew){
      bodyHtml+=`<div style="font-size:10px;color:#f1c40f;margin-bottom:8px">
        🍖 새 피난민 고용: <b>식량 ${HIRE_COST}</b> (보유: ${Math.floor(res.food)})
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;justify-content:center">
        <button onclick="defeatChangeHire(-1)" style="font-size:1.2em;width:32px;height:32px;border-radius:50%;border:1px solid #374151;background:#0f1923;color:#60a5fa;cursor:pointer;touch-action:manipulation">−</button>
        <span id="defeat-hire-count" style="font-size:1.2em;color:#f1c40f;min-width:30px;text-align:center">0</span>

// 스킬 레벨 관리 (최대 5랩, 사용할수록 자동 상승)
const SKILL_LV_THRESHOLDS=[0,20,60,120,220,400]; // 누적 사용 횟수 기준
function getSkillLv(u,sk){
  if(!u.skillLv)u.skillLv={};
  return u.skillLv[sk]||1;
}
function useSkill(u,sk){
  if(!u.skillUse)u.skillUse={};
  if(!u.skillLv)u.skillLv={};
  u.skillUse[sk]=(u.skillUse[sk]||0)+1;
  const uses=u.skillUse[sk];
  const curLv=u.skillLv[sk]||1;
  if (curLv < 5 && uses >= SKILL_LV_THRESHOLDS[curLv]) {
    u.skillLv[sk] = curLv + 1;
    const nextLvDisplay = u.skillLv[sk] >= 5 ? "MAX" : "Lv" + u.skillLv[sk];
    addFloat(u.x, u.y - 24, `${sk} ${nextLvDisplay}↑`, '#f1c40f');
    alog(`⭐ ${u.name}의 [${sk}] 스킬이 ${nextLvDisplay}(으)로 성장!`);
  } 
}
// 스킬 레벨에 따른 배율 (공격/힐 공통)
function skillMult(u,sk){
  const lv=getSkillLv(u,sk);
  return 1.0+(lv-1)*0.15; // Lv1=×1.0, Lv2=×1.15, Lv3=×1.30, Lv4=×1.45, Lv5=×1.60
}

function applyDmg(a,tgt,cell,sk,mult=1){
  const role=a.classKey||a.baseRole;
  const tRole=tgt.role||tgt.classKey||tgt.baseRole||'basic';
  let dmg=(BASE_ROLES[role]?.atk||30)+a.bonusAtk+(a.bonusMagic||0)*0.5;
  const tb=TERRAIN[cell?.type||'plain'].bonus[role]||1.0;
  if(tb>1)dmg=Math.floor(dmg*tb);
  if(sk==='Ambush'&&cell?.type==='forest')dmg=Math.floor(dmg*1.8);
  if(sk==='Highland'&&(cell?.type==='mountain'||cell?.type==='hill'))dmg=Math.floor(dmg*1.6);

  // 타입 어드밴티지
  // 마법사: 방어력 높은 적(탱커·전사)에 +40%
  if((role==='Mage'||role==='Sorcerer'||role==='Warlock')&&
     (tRole==='Tank'||tRole==='Melee'||tRole==='Paladin'||tRole==='Gladiator'||tRole==='Berserker')){
    dmg=Math.floor(dmg*1.4);
  }
  // 전투가·원거리: 방어 약한 적(마법사·힐러·전투가·원딜)에 +30%
  if((role==='Warrior'||role==='Ranged'||role==='Berserker2'||role==='Sniper'||role==='Artillery'||role==='Duelist')&&
     (tRole==='Mage'||tRole==='Heal'||tRole==='Warrior'||tRole==='Ranged'||
      tRole==='Sorcerer'||tRole==='Warlock'||tRole==='Cleric'||tRole==='Shaman')){
    dmg=Math.floor(dmg*1.3);
  }

  dmg=Math.floor(dmg*mult*skillMult(a,sk));
  if(sk)useSkill(a,sk);
  const reduced=Math.floor(dmg*(1-Math.min(tgt.def,0.75)));
  tgt.hp-=reduced;
  addFloat(tgt.x,tgt.y-12,`-${reduced}`,'#f1c40f');
  if(tgt.hp<=0){tgt.dead=true;gainExp(a,40);elog(`☠️ ${tgt.name} 처치`);}
}

// 맵 경계 클램프 (유닛이 맵 밖으로 나가지 않게)
const MAP_PAD=18; // 유닛 반지름 정도의 여백
function clampToMap(u){
  u.x=Math.max(MAP_PAD, Math.min(CW-MAP_PAD, u.x));
  u.y=Math.max(MAP_PAD, Math.min(CH-MAP_PAD, u.y));
}

function moveAlly(a,ae,aa,baseTerrSpd){
  const role=a.classKey||a.class10Key||a.baseRole||'Melee';

  // 현재 지형 이동속도 계산 (지형 비용의 역수)
  const curCell=nearestCell(a.x,a.y);
  const terrCost=curCell?terrainMoveCost(curCell,role):1.0;
  // 최소 이동속도 보장: terrCost가 아무리 높아도 기본 속도의 20% 이상
  const terrSpd=Math.max(0.20, Math.min(1.0, 1.0/Math.max(terrCost*0.6, 0.1)));
  const spd=a.spd*terrSpd;

  // 홀드: 웨이포인트 있으면 이동, 없으면 정지
  if(a.onHold&&(a.wx===null||a.wy===null)) return;

  // [수정] 유닛 이동 로직 (moveAlly 내 웨이포인트 부분)
  // 유닛이 벽에 막혀서 목적지에 도달하지 못할 때 멍하니 서 있는 현상 방지
  if(a.wx!==null&&a.wy!==null){
      const dx=a.wx-a.x, dy=a.wy-a.y, d=Math.hypot(dx,dy);
      
      // 벽 근처에서 목적지가 벽 너머일 때 "도착"으로 간주하는 판정 추가
      const atEdgeX = (a.x <= MAP_PAD + 2 && dx < 0) || (a.x >= CW - MAP_PAD - 2 && dx > 0);
      const atEdgeY = (a.y <= MAP_PAD + 2 && dy < 0) || (a.y >= CH - MAP_PAD - 2 && dy > 0);

      if(d < 8 || (atEdgeX || atEdgeY)){ 
        a.wx=null; a.wy=null;
        // 도착 후 원래 상태(홀드 등) 복구 로직
      } else {
        a.x+=dx/d*spd; a.y+=dy/d*spd; clampToMap(a);
      }
      return;
  }

  // Fortress: 방어 버프만 적용, 이동은 정상 (아래 moveAlly 로직으로 처리)

  const isHealer=role==='Heal'||
    (role==='Refugee'&&a.activeSkills&&a.activeSkills.some(s=>['Mend','Barrier','Revive'].includes(s)));

  // 힐러: HP 낮은 탱커 우선 → 일반 아군 추종
  if(isHealer){
    const healRange=210+(a.bonusRange||0);
    const now2=Date.now();
    // 최우선: 빈사 대원
    const dying=allies.filter(x=>x.dead&&!x.permanentlyDead&&x.deathTime&&(now2-x.deathTime)<7000&&x.isDeployed);
    if(dying.length>0){
      dying.sort((x,y)=>x.deathTime-y.deathTime);
      const tgt=dying[0];
      if(dist(a,tgt)<=healRange) return;
      const best=bestAdjacentCell(a,tgt.x,tgt.y);
      if(best){const dx=best.x-a.x,dy=best.y-a.y,dn=Math.hypot(dx,dy);if(dn>1){a.x+=dx/dn*spd*1.2;a.y+=dy/dn*spd*1.2;clampToMap(a);}}
      return;
    }
    // HP 낮은 탱커 우선 추종, 없으면 가장 가까운 아군
    const follow=aa.filter(x=>x!==a&&!x.dead&&x.isDeployed)
      .sort((x,y)=>{
        const xTank=(x.classKey||x.baseRole)==='Tank'?0:1;
        const yTank=(y.classKey||y.baseRole)==='Tank'?0:1;
        if(xTank!==yTank)return xTank-yTank;
        return (x.hp/x.maxHp)-(y.hp/y.maxHp);
      })[0];
    if(!follow)return;
    const wounded=aa.filter(x=>x!==a&&x.hp<x.maxHp).sort((x,y)=>x.hp-y.hp);
    const inRange=wounded.find(x=>hasLOS(a.x,a.y,x.x,x.y)&&dist(a,x)<healRange);
    if(inRange)return;
    const d=dist(a,follow);
    if(d<=healRange*0.55)return;
    const best=bestAdjacentCell(a,follow.x,follow.y);
    if(best){const dx=best.x-a.x,dy=best.y-a.y,dn=Math.hypot(dx,dy);if(dn>1){a.x+=dx/dn*spd;a.y+=dy/dn*spd;clampToMap(a);}}
    return;
  }

  // 탱/딜: 가장 가까운 적을 향해 이동
  const enemyTgt=closest(a,ae,Infinity);
  if(enemyTgt){
    const rd2=BASE_ROLES[role];
    const isTank=role==='Tank'||a.activeSkills?.includes('Fortress')||a.activeSkills?.includes('Taunt');
    const attackRange=isTank?30:(rd2?.range||65)-15;
    const d=dist(a,enemyTgt);
    if(d>attackRange){
      const best=bestAdjacentCell(a,enemyTgt.x,enemyTgt.y);
      if(best){const dx=best.x-a.x,dy=best.y-a.y,dn=Math.hypot(dx,dy);if(dn>1){a.x+=dx/dn*spd;a.y+=dy/dn*spd;clampToMap(a);}}
    }else if(role==='Ranged'||role==='Mage'||(role==='Refugee'&&a.activeSkills?.includes('Arrow'))){
      if(d<80){const dx=a.x-enemyTgt.x,dy=a.y-enemyTgt.y,dn=Math.hypot(dx,dy);if(dn>1){a.x+=dx/dn*spd*0.5;a.y+=dy/dn*spd*0.5;clampToMap(a);}}
    }
  }
}

let _garrisonTimer = null; // 자동 진행 타이머
let globalDifficulty = 1.0; // 전역 난이도 (상단에 이미 있다면 제외)

function showGarrisonModal(zid) {
  _garrisonZoneId = zid;
  const zone = ZONES[zid];
  if(!zone) return;

  const GARRISON_LIMIT = 6;
  window._garrisonHireCount = GARRISON_LIMIT; // 기본 6명 설정

  document.getElementById('garrison-title').innerText = `🚩 ${zone.name} — 거점 활성화`;
  document.getElementById('garrison-sub').innerText = `사냥터 정복 완료! 5초 후 자동으로 대원들이 배치됩니다.`;

  // UI 렌더링 함수 (기존 코드 유지)
  if (window._renderGarrisonBody) {
      window._renderGarrisonBody();
  } else {
      // 직접 렌더링 로직 (위의 index 22 코드 참조)
      renderGarrisonBodyInternal(); 
  }

  document.getElementById('garrison-modal').classList.add('show');

  // 자동 승인 타이머 (5초)
  clearTimeout(_garrisonTimer);
  _garrisonTimer = setTimeout(() => {
    if (document.getElementById('garrison-modal').classList.contains('show')) {
      confirmGarrison();
    }
  }, 5000);
}

// 인원 조절 시 타이머 해제 (수동 조작 시 자동 진행 멈춤)
window.garrisonChangeHire = function(delta) {
  clearTimeout(_garrisonTimer); // 유저가 클릭하면 자동 타이머 취소
  const next = (window._garrisonHireCount || 0) + delta;
  if (next >= 0 && next <= 6) {
    window._garrisonHireCount = next;
    if (window._renderGarrisonBody) window._renderGarrisonBody();
  }
};

// 확인 버튼 로직 (난이도 상승 및 재출발 포함)
// [수정] 거점 배치 확정 및 다음 구역 자동 진행 연결
function confirmGarrison() {
  clearTimeout(_garrisonTimer);
  const cnt = window._garrisonHireCount || 0;
  const cost = cnt * 30;

  // 식량이 부족하면 가능한 만큼만 고용
  if (res.food < cost) {
    window._garrisonHireCount = Math.max(0, Math.floor(res.food / 30));
  }

  // 자원 차감 및 거점 등록
  res.food -= (window._garrisonHireCount * 30);
  food = res.food; // 동기화

  // zoneRecords에 주둔 인원 기록 (ID 리스트로 관리)
  const rec = zoneRecords[_garrisonZoneId];
  if (rec) {
    rec.garrison = [];
    // 필요한 숫자만큼 가상의 유닛 데이터를 넣거나 기존 대기 유닛을 넣음
    // 여기서는 간단하게 숫자만큼 빈 객체 추가 (garrisonEfficiency에서 처리됨)
    for(let i=0; i<window._garrisonHireCount; i++) {
        rec.garrison.push({id: 999000 + i, lv: 1}); 
    }
  }

  document.getElementById('garrison-modal').classList.remove('show');
  alog(`🚩 ${ZONES[_garrisonZoneId]?.name || _garrisonZoneId} 거점화 완료! (인원: ${window._garrisonHireCount}명)`);

  // [핵심] 배치가 끝나면 즉시 다음 난이도/구역으로 확장 및 진행
  autoStartNextZone(_garrisonZoneId);
}

function proceedToNextDifficulty() {
  // 난이도 상승 (적 체력/공격력 20% 증가)
  globalDifficulty += 0.2; 
  
  // 스테이지 리셋
  zoneStage = 1; 
  stage = 1;
  
  alog(`⚔️ 난이도가 상승했습니다! (Lv.${Math.round(globalDifficulty * 5)}) 다시 전장으로 이동합니다.`);

  // 4. 자동 전투 ON일 경우, 이전 배치 그대로 즉시 시작
  if (autoStart) {
    setTimeout(() => {
      // 이미 유닛들이 배치되어 있다면 바로 전투 시작
      if (!isBattle) toggleBattle();
    }, 1500);
  }
}

}

window.buildCiv=function(key){

let _shopTimer=null;
let _currentShopItems=[];
let _merchantPresent=false;

const SHOP_ITEMS_POOL=[
  {key:'food',   label:'🍖 식량',   buy:2,   sell:1,  res:'food'},
  {key:'wood',   label:'🌲 나무',   buy:4,   sell:2,  res:'wood'},
  {key:'stone',  label:'🔘 돌',     buy:4,   sell:2,  res:'stone'},  
  {key:'iron',   label:'⚒️ 철',     buy:8,   sell:4,  res:'iron'},  
  {key:'herb',   label:'🌿 약초',   buy:10,  sell:6,  res:'herb'},
  {key:'diamond',label:'💎 다이아', buy:50,  sell:30, res:'diamond'}, 
];

// 마을 단계(phase 1)부터 목재·석재 거래 가능, 도시부터 철도 추가
function getShopPool(){
  if(civPhase>=2) return SHOP_ITEMS_POOL; // 도시: 전품목
  if(civPhase>=1) return SHOP_ITEMS_POOL.filter(i=>i.key!=='iron'&&i.key!=='diamond'); // 마을: 철·다이아 제외
  return SHOP_ITEMS_POOL.filter(i=>i.key==='food'||i.key==='herb'); // 피난민: 식량·약초만
}

function generateShopItems(){
  const pool=[...getShopPool()];
  const cnt=Math.min(3+Math.floor(Math.random()*2), pool.length);
  const picked=[];
  // 마을 전: ±50% 변동, 마을 후: ±20%
  const varyBase=civPhase>=1?0.8:0.5;
  const varyMax=civPhase>=1?0.4:1.0;
  for(let i=0;i<cnt&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const item=pool.splice(idx,1)[0];
    const vary=varyBase+Math.random()*varyMax;
    picked.push({...item,buy:Math.max(1,Math.round(item.buy*vary)),sell:Math.max(1,Math.round(item.sell*vary))});
  }
  return picked;
}

let _merchantDepartTime=0;

function spawnMerchant(){
  _merchantPresent=true;
  _currentShopItems=generateShopItems();
  _merchantDepartTime=Date.now()+60000; // 1분 체류
  const btn=document.getElementById('shop-btn');
  if(btn){btn.style.display='inline';updateMerchantBtn();}
  alog('🛒 상인이 나타났습니다! (1분 체류)');
}

function updateMerchantBtn(){
  if(!_merchantPresent||civPhase>=2) return;
  const btn=document.getElementById('shop-btn');
  if(!btn) return;
  const left=Math.max(0,Math.ceil((_merchantDepartTime-Date.now())/1000));
  const mm=Math.floor(left/60), ss=left%60;
  const timeStr=mm>0?`${mm}:${ss<10?'0':''}${ss}`:`${ss}초`;
  btn.innerHTML=`<button onclick="openShop(event)" style="font-size:0.72em;padding:2px 8px;border-radius:4px;border:1px solid #f1c40f;background:#2d2600;color:#f1c40f;cursor:pointer;touch-action:manipulation">🛒 상인 (${timeStr})</button>`;
}

function dismissMerchant(){
  _merchantPresent=false;
  const btn=document.getElementById('shop-btn');
  if(btn&&civPhase<2)btn.style.display='none'; // 도시 이후엔 상주
}

function startMerchantSchedule(){
  if(_shopTimer)clearTimeout(_shopTimer);
  function schedule(){
    let delay;
    if(civPhase>=2) delay=180000;           // 도시: 3분 상주
    else if(civPhase>=1) delay=240000+Math.random()*120000; // 마을: 4~6분 주기적
    else delay=300000+Math.random()*420000; // 피난민: 5~12분 완전 랜덤
    window._merchantNextTime=Date.now()+delay;
    _shopTimer=setTimeout(()=>{
      window._merchantNextTime=0;
      spawnMerchant();
      if(civPhase<2){setTimeout(()=>{dismissMerchant();schedule();},60000);}
    },delay);
  }
  schedule();
}

window.openShop = function(ev) {
  if (ev) ev.stopPropagation();
  if (!_merchantPresent && civPhase < 2) { alog('상인이 없습니다.'); return; }
  
  // 1. 현재 보유 재원을 보여주는 그리드 바 생성
  const resLine = `<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; background:#080c10; padding:8px; border-radius:5px; margin-bottom:10px; font-size:10px; border:1px solid #1e3a5f;">
    <span>🍖 ${res.food}</span> <span>💰 ${res.gold}</span> <span>🌿 ${res.herb}</span>
    <span>돌 ${res.stone}</span> <span>나무 ${res.wood}</span> <span>철 ${res.iron}</span>
  </div>`;

  // 2. 상점 제목 및 설명 설정 (설명 부분에 위에서 만든 재원 바 삽입)
  if (!_currentShopItems.length) _currentShopItems = generateShopItems();
  document.getElementById('shop-title').innerText = civPhase >= 2 ? '🏪 상설 상점' : '🛒 방문 상인';
  
  // innerHTML을 사용하여 재원 바(resLine)를 함께 출력합니다.
  document.getElementById('shop-sub').innerHTML = resLine + 
    (civPhase >= 2 ? '도시에 상설 상점이 열렸습니다.' : '상인이 잠시 들렀습니다. 거래하시겠어요?');

  // 3. 상점 아이템 리스트 생성
  const itemsHtml = _currentShopItems.map((it, i) => {
    const cur = it.res === 'food' ? res.food : (it.res === 'gold' ? res.gold : res[it.res] || 0);
    return `<div style="background:#111d2b; border:1px solid #1e3a5f; border-radius:6px; padding:8px; display:flex; align-items:center; gap:8px">
      <span style="flex:1; font-size:11px; color:#e2e8f0">${it.label}</span>
      <span style="font-size:9px; color:#6b7280">보유: ${cur}</span>
      <button onclick="shopBuy(${i},10)" style="font-size:9px; padding:3px 7px; background:#1a3d1a; border:1px solid #2ecc71; color:#2ecc71; border-radius:3px; cursor:pointer; touch-action:manipulation">구입 ×10<br><span style="color:#f1c40f">${it.buy*10}G</span></button>
      <button onclick="shopSell(${i},10)" style="font-size:9px; padding:3px 7px; background:#1a1a3d; border:1px solid #60a5fa; color:#60a5fa; border-radius:3px; cursor:pointer; touch-action:manipulation">판매 ×10<br><span style="color:#f1c40f">${it.sell*10}G</span></button>
    </div>`;
  }).join('');

  // 4. 모달 표시
  document.getElementById('shop-items').innerHTML = itemsHtml;
  document.getElementById('shop-modal').classList.add('show');
};

window.shopBuy=function(idx,qty){
  const it=_currentShopItems[idx];if(!it)return;
  const cost=it.buy*qty;
  if(res.gold<cost){alog(`❌ 금화 부족 (필요 ${cost}G)`);return;}
  res.gold-=cost; gold=res.gold;
  if(it.res==='food'){res.food+=qty;food=res.food;}
  else if(it.res==='gold'){res.gold+=qty;}
  else res[it.res]=(res[it.res]||0)+qty;
  alog(`🛒 ${it.label} ×${qty} 구입 (-${cost}💰)`);
  markDirty();window.openShop({stopPropagation:()=>{}});
};

window.shopSell=function(idx,qty){
  const it=_currentShopItems[idx];if(!it)return;
  const cur=it.res==='food'?res.food:(res[it.res]||0);
  const actual=Math.min(qty,cur);
  if(actual<=0){alog(`❌ ${it.label} 없음`);return;}
  const earn=it.sell*actual;
  res.gold+=earn; gold=res.gold;
  if(it.res==='food'){res.food-=actual;food=res.food;}
  else res[it.res]=(res[it.res]||0)-actual;
  alog(`🛒 ${it.label} ×${actual} 판매 (+${earn}💰)`);
  markDirty();window.openShop({stopPropagation:()=>{}});
};
